/* ── Transacting: one cell. Totals, a stat strip, then a tile per shop that reflows 4 / 3 / 2 / 1 by the cell's own width. ── */
function transactingCell(){
  const oct = TXO.reduce((a,m)=>a+m.oct,0), n = TXO.reduce((a,m)=>a+m.octN,0), orig = TXO.reduce((a,m)=>a+m.orig,0), lost = TXO.reduce((a,m)=>a+m.lost,0);
  const pace = m => m.sept ? (m.oct/21*30)/m.sept - 1 : null;
  const sorts = {busy:(a,b)=>b.oct-a.oct, growth:(a,b)=>(pace(b)??9)-(pace(a)??9), az:(a,b)=>a.name.localeCompare(b.name)};
  const list = TXO.slice().sort(sorts[XS.txsort]);
  const top3 = TXO.slice().sort(sorts.busy).slice(0,3).reduce((a,m)=>a+m.oct,0);
  const opts = [['busy','Busiest',''],['growth','Fastest growing',''],['az','A to Z','']];
  const stat = (k, v, sub) => `<div class="txs"><span class="lbl">${k}</span><b class="fig fig-m">${v}</b><span class="small quiet">${sub}</span></div>`;
  const tile = (m, i) => {
    const v = series(14, Math.max(14, m.octN*3), j=>0.6+0.4*Math.sin((j+i)/2.5)+0.03*j, m.orig+3), p = pace(m);
    const chg = p==null ? '<span class="tx-chg new">New</span>' : `<span class="tx-chg ${p>=0?'up':'down'}">${p>=0?'+':'−'}${Math.abs(p*100).toFixed(0)}%</span>`;
    return `<button type="button" class="tx" data-merchant="${m.id}">
      <b class="tx-name">${m.name}</b>${chg}
      <b class="num tx-amt">${money(m.oct)}</b>
      <span class="tx-spark">${spark(v)}</span>
    </button>`; };
  return `<section class="cell s-12"><header class="c-hd"><span class="lbl">Cleared at partner shops</span><span class="tag">${TXO.length} shops · October</span></header>
    <div class="c-fig">${figHtml(money(oct), `cleared at 12 shops in October · Uptown Barber joined today`)}</div>
    <div class="c-body flush txwrap">
      <div class="txstrip">${stat('Sales', int(n), 'in October')}${stat('Average sale', money(oct/n), 'across all shops')}${stat('Loss rate', pct(lost,orig), `${lost} of ${orig} originations`)}${stat('Top 3 shops', pct(top3, oct), 'of October’s volume')}</div>
      <div class="sub-hd"><span class="sub-hd-k"><span class="lbl">Each shop</span><span class="small quiet">Change is October’s pace against September</span></span><span class="hd-tools">${ddHtml('xsort', opts, XS.txsort, 'Sort')}</span></div>
      <div class="txgrid">${list.map(tile).join('')}</div>
    </div>
    <div class="c-ft"><button type="button" data-xpane="partners"><span class="t">Full table in Partners</span>${ic('chev','sm')}</button></div></section>`;
}

/* ══ Money ══════════════════════════════════════════════════════════════
   Read-only. Each tab answers one question. Two checks stay apart on purpose: RTD is the gate
   (AssurancePool over unsecured credit); claims-in-order is a reporting view and is never summed.
   Ties: $12,839.25 owed to shops by 4 Nov, $1,482.36 due from members, payout pool $10,240.00,
   so the pool runs $1,116.89 short on 4 Nov. PayoutPool.drawForDueClaim then borrows the gap: the yield pool's free cash first,
   then AssurancePool excess (never its primary reserve). Repaid from member repayments, principal then carry. */
const NS = { pane:'overview', sf:'all', acct:null };
const M = {
  savings:38940.20, cash:21480.75, payout:10240.00, assurance:1420.00, coop:476.20,

  owed14:12839.25, dueMembers:1482.36, bonds:25000.00, floor:0.20
};
/* the yield pool (LendingPool on Base Sepolia, ERC-4626). It funds the unsecured tiers and takes their first loss,
   before the AssurancePool. Rates follow the contract's curve: per cycle, base 25 bps, +75 to the 80% kink, +900 past it.
   Depositors are paid through the share price: nothing is distributed, it's realised when they withdraw. */
const Y = { assets:9000.00, principal:8962.10, lent:M.unsecured, depositors:18, pledged:1200.00, queued:0, opened:'15 Oct', cycleDays:30,
  curve:{base:25, s1:75, s2:900, kink:0.80} };
Y.cash = Y.assets - Y.lent; Y.util = Y.lent / Y.assets; Y.earned = Y.assets - Y.principal; Y.price = Y.assets / Y.principal;
const yBorrowBps = u => u <= Y.curve.kink ? Y.curve.base + Y.curve.s1*u/Y.curve.kink : Y.curve.base + Y.curve.s1 + Y.curve.s2*(u-Y.curve.kink)/(1-Y.curve.kink);
const yApr = bps => bps/10000 * 365/Y.cycleDays;                       /* simple, per year */
const yApy = bps => Math.pow(1 + bps/10000, 365/Y.cycleDays) - 1;       /* compounded each cycle */
Y.borrowBps = yBorrowBps(Y.util); Y.supplyBps = Y.borrowBps * Y.util; Y.apy = yApy(Y.supplyBps); Y.apr = yApr(Y.borrowBps);
M.rtd = M.assurance / M.unsecured;
M.room = M.assurance / M.floor - M.unsecured;            /* unsecured credit that can still issue */
M.short = Math.max(0, M.owed14 - M.payout - M.dueMembers);
/* the 4 Nov payout gap, borrowed from the pool's free cash when the claim comes due */
Y.toPayout = Math.min(M.short, Y.cash); Y.utilAfter = (Y.lent + Y.toPayout) / Y.assets; Y.apyAfter = yApy(yBorrowBps(Y.utilAfter)*Y.utilAfter);

/* ── shared drawing ───────────────────────────────────────────────────── */
const pctX = (t, a, b) => Math.max(0, Math.min(100, (t-a)/(b-a)*100));
function axisHtml(from, to, step){ /* step: 'month' | days */
  const out = [];
  if (step==='month'){ const d = new Date(from); d.setUTCDate(1); if (d.getTime()<from) d.setUTCMonth(d.getUTCMonth()+1);
    for (; d.getTime()<=to; d.setUTCMonth(d.getUTCMonth()+1)){ const m = d.getUTCMonth(); out.push([d.getTime(), m===0 ? `Jan ${String(d.getUTCFullYear()).slice(2)}` : MON[m]]); } }
  else for (let t = from; t <= to; t += step*DAY) out.push([t, fmtD(t)]);
  return out;
}
function laneFrame(rows, from, to, step, cls){ /* label column + lanes, with month/day grid, today and the next-90-days shade */
  const ax = axisHtml(from, to, step), tX = pctX(NOW, from, to);
  return `<div class="ln ${cls||''}">
    <div class="ln-ax"><span></span><span class="ln-axl">${ax.map(([t,l])=>`<span style="left:${pctX(t,from,to)}%">${l}</span>`).join('')}<span class="now" style="left:${tX}%">Today</span></span></div>
    <div class="ln-bd"><div class="ln-ov">${ax.map(([t])=>`<i class="g" style="left:${pctX(t,from,to)}%"></i>`).join('')}<i class="t" style="left:${tX}%"></i></div>${rows}</div></div>`;
}

/* agreement terms as bars */
function gantt(list, from, to, agg){
  const tX = pctX(NOW, from, to);
  const row = x => { let lane = '';
    if (x.st==='draft') lane = `<i class="gb-draft" style="left:${tX}%">Draft ${x.ver}</i>`;
    else if (x.st==='out') lane = `<i class="gb out" style="left:${pctX(x.sent,from,to)}%;width:${tX-pctX(x.sent,from,to)}%"></i><i class="gb-tag live" style="left:${tX}%">Waiting on you</i>`;
    else { const a = pctX(x.a, from, to), b = x.b ? pctX(x.b, from, to) : 100, soon = x.b && x.b-NOW < 90*DAY;
      lane = `<i class="gb${x.b?'':' open'}${x.a<from?' cut':''}" style="left:${a}%;width:${b-a}%"></i>${x.b && x.b<=to ? `<i class="gb-end${soon?' soon':''}" style="left:${b}%"></i>${soon?`<i class="gb-tag" style="left:${b}%">${fmtD(x.b)}</i>`:''}` : ''}`; }
    return `<button type="button" class="ln-r" data-agr="${x.id}"><span class="ln-k"><b>${x.party}</b><span>${x.name}</span></span><span class="ln-l">${lane}</span></button>`; };
  let rows = list.map(row).join('');
  if (agg){ const ms = AGR.filter(x=>x.type==='merchant' && x.a), s0 = Math.min(...ms.map(x=>x.a)), e0 = Math.min(...ms.map(x=>x.b)), e1 = Math.max(...ms.map(x=>x.b));
    rows += `<button type="button" class="ln-r agg" data-cpane="agreements"><span class="ln-k"><b>${ms.length+1} merchant partners</b><span>12-month terms</span></span><span class="ln-l">
      <i class="gb-band" style="left:${pctX(s0,from,to)}%;width:${pctX(e1,from,to)-pctX(s0,from,to)}%"></i>
      ${ms.map(x=>`<i class="gt-s" style="left:${pctX(x.a,from,to)}%"></i><i class="gt-e" style="left:${pctX(x.b,from,to)}%"></i>`).join('')}

  return laneFrame(rows, from, to, 'month', 'gt');
}

/* the protocol, drawn */
function protoMap(){
  const N = id => ctrOf(id), W = 15, HN = 3.0;  /* node half-width and half-height, in % */
  /* fan lines out where several leave or meet the same side of a box, so they never stack */
  const fan = {}, offA = [], offB = [];
  EDGES.forEach((e,i)=>{ const A = N(e[0]), B = N(e[1]); if (A[7]===B[7]) return; const fw = B[7] > A[7];
    (fan[e[0]+(fw?'R':'L')] = fan[e[0]+(fw?'R':'L')] || []).push([i,'A',B[8]]); (fan[e[1]+(fw?'L':'R')] = fan[e[1]+(fw?'L':'R')] || []).push([i,'B',A[8]]); });
  Object.values(fan).forEach(l=>{ l.sort((x,y)=>x[2]-y[2]); l.forEach(([i,w],j)=>{ const o = (j-(l.length-1)/2)*1.5; (w==='A'?offA:offB)[i] = o; }); });
  EDGES.forEach((e,i)=>{ const A = N(e[0]), B = N(e[1]); if (A[7]!==B[7] && A[8]===B[8]){ const o = (offA[i]||0) || (offB[i]||0); offA[i] = o; offB[i] = o; } });
  const geo = (e,i) => { const A = N(e[0]), B = N(e[1]), fw = B[7] > A[7];
    return { x1:(A[7] + (fw?W/2:-W/2)), x2:(B[7] - (fw?W/2:-W/2)), y1:A[8]+(offA[i]||0), y2:B[8]+(offB[i]||0) }; };
  const path = (e,i) => { const [a,b,k] = e, A = N(a), B = N(b);
    if (A[7]===B[7]){ const dn = B[8] > A[8]; return `<path d="M${A[7]*10},${A[8]+(dn?HN:-HN)} L${B[7]*10},${B[8]+(dn?-HN:HN)}" class="mp-e ${k}"/>`; }
    const g = geo(e,i), mx = (g.x1+g.x2)/2*10;
    return `<path d="M${g.x1*10},${g.y1} C${mx},${g.y1} ${mx},${g.y2} ${g.x2*10},${g.y2}" class="mp-e ${k}"/>`; };
  const lbl = (e,i) => { const [a,b,k,,l,lx] = e; if (!l) return ''; const A = N(a), B = N(b); if (A[7]===B[7]) return '';
    const g = geo(e,i), x = lx!=null ? lx : (g.x1+g.x2)/2, y = lx!=null ? g.y1 : (g.y1+g.y2)/2;
    return `<span class="mp-el ${k}" style="left:${x}%;top:${y}%">${l}</span>`; };
  const pend = {ap:'v1.3 · waiting on you', mr:'1 change in the wait', vr:'Waits on D&T Co.', bb:'6 bonds', lp:'Not funded yet', bv:'Not funded yet'};
  return `<div class="mp" role="img" aria-label="How the contracts connect">
    <div class="mp-safe"><b>Ops Safe</b><span>2 of 3 · admin and pause on every live contract</span></div><div class="mp-in">
    ${LAYERS.map((l,i)=>`<span class="mp-lay" style="left:${10+i*20}%">${l}</span><i class="mp-drop" style="left:${10+i*20}%"></i>`).join('')}
    <i class="mp-sep" style="top:7.5%"></i><span class="mp-band" style="top:7.5%">Credit and money</span><i class="mp-sep" style="top:77%"></i><span class="mp-band" style="top:77%">Deeds and real assets</span>
    <svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">${EDGES.map(path).join('')}</svg>
    ${EDGES.map(lbl).join('')}
    ${CTR.map(c=>`<button type="button" class="mp-n ${c[4]}${pend[c[0]]&&!['bb','lp','bv'].includes(c[0])?' pend':''}${c[0]==='ap'?' me':''}${['bb','lp','bv'].includes(c[0])?' info':''}" data-ctr="${c[0]}" style="left:${c[7]}%;top:${c[8]}%"><span class="mp-h"><b>${c[1]}</b><span class="mono">${c[2]}</span></span>${pend[c[0]]?`<span class="mp-t">${pend[c[0]]}</span>`:''}</button>`).join('')}
  </div></div>
  <div class="mp-list">${[['c','Credit and money'],['d','Deeds and real assets']].map(([b,bn])=>`<div class="mp-lb">${bn}</div>`+LAYERS.map((l,i)=>{ const cs = CTR.filter(c=>c[3]===i && c[9]===b); return cs.length ? `<div class="ph-c"><span class="lbl">${l}</span>${cs.map(c=>`<button type="button" class="ph-r" data-ctr="${c[0]}"><i class="${c[4]}"></i><span>${c[1]}${pend[c[0]]?` <em>${pend[c[0]]}</em>`:''}</span><span class="mono quiet">${c[2]}</span></button>`).join('')}</div>` : ''; }).join('')).join('')}</div>`;
}

    <div class="c-fig">${figHtml(String(CS.af==='all'?AGR.length:list.length), `${CS.af==='all'?'agreements · merchant partners grouped, pick them in the menu':AGR_T[CS.af].toLowerCase()} · each bar is a term, each square a renewal`)}</div>

  const wk = Array.from({length:12},(_,i)=>D(8,3)+i*7*DAY), ms = AGR.filter(a=>a.type==='merchant' && a.a);

function entMap(){
  const n = id => entOf(id), H = 6.4;   /* half a node, in % of the map */
  const L = (x1,y1,x2,y2,cls='') => `<line x1="${x1*10}" y1="${y1}" x2="${x2*10}" y2="${y2}" class="em-l ${cls}"/>`;
  const subs = ['fin','dt','hold','labs'], bus = 25, sy = 41, my = 63, bus2 = 78, ky = 92, fx = 91, edge = 70 + 8.5;
  const lines = L(40,11+H,40,bus) + L(10,bus,70,bus) + subs.map(s=>L(n(s)[5],bus,n(s)[5],sy-H)).join('')
    + L(50,sy+H,50,my-H) + L(50,my+H,50,bus2) + L(34,bus2,66,bus2) + L(34,bus2,34,ky-H) + L(66,bus2,66,ky-H)
    + L(82,0,82,100,'div') + L(fx,11+H,fx,sy,'dash') + L(fx,sy,edge,sy,'dash');
  const tag = (x, y, t, cls='') => `<span class="em-o ${cls}" style="left:${x}%;top:${y}%">${t}</span>`;
  const tags = subs.map(s=>tag(n(s)[5], (bus+sy-H)/2, OWN[s])).join('')
    + tag(50, (sy+H+my-H)/2, '100%') + tag(50, (my+H+bus2)/2, 'manages')
    + tag(34, (bus2+ky-H)/2, 'Holdings majority') + tag(66, (bus2+ky-H)/2, 'Holdings 100%')
    + tag(fx, (11+H+sy)/2, 'maintains for', 'dash');
  const pips = id => { const b = GBOARDS.find(x=>x[1]===id); return b ? `<span class="em-p" title="${b[0]}: ${b[2].filter(x=>x[1]).length} of ${b[2].length} seats">${b[2].map(x=>`<i class="${x[1]?'on':''}"></i>`).join('')}</span>` : ''; };
  const due = id => FILINGS.filter(f=>f[1]===id && f[3]-NOW < 30*DAY && f[4]!=='later');
  return `<div class="em" role="img" aria-label="Entity structure">
    <svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">${lines}</svg>${tags}
    <span class="em-out" style="left:91%;top:0">Outside the tree</span><span class="em-out" style="left:40%;top:0">Owned by the members</span>
    ${ENT.map(e=>{ const d = due(e[0]);
      return `<button type="button" class="em-n ${e[3]}${d.length?' due':''}${VS.ent===e[0]?' sel':''}" data-ent="${e[0]}" style="left:${e[5]}%;top:${e[6]}%"><span class="em-top"><b>${e[1]}</b></span><span class="em-mid"><span class="em-k">${e[2]}</span>${pips(e[0])}</span>
        <span class="em-s"><span class="em-st"><i style="background:${EST[e[3]][0]}"></i><span class="em-st-t">${EST[e[3]][1]}</span></span>${d.length?`<span class="em-d"><span class="em-dl">${fshort(d[0])} · </span><span class="em-dt">Due </span>${fmtD(d[0][3])}</span>`:''}</span></button>`; }).join('')}
  </div>
  <div class="mp-list">${[['Parent',['coop']],['Owned by the co-op',['fin','dt','hold','labs']],['Under Holdings',['mgr','prop','lend']],['Outside the tree',['fdn']]].map(([l,ids])=>`<div class="ph-c"><span class="lbl">${l}</span>${ids.map(id=>{ const e = entOf(id);
    return `<button type="button" class="ph-r" data-ent="${id}"><i class="${e[3]==='formed'?'':e[3]==='forming'?'build':'later'}"></i><span>${e[1]}</span><span class="mono quiet">${OWN[id]||''}</span></button>`; }).join('')}</div>`).join('')}</div>`;
}

function filingLanes(list, from, to, labels){
  const ids = ['coop','labs','fin','dt','hold','fdn'];
  const rows = ids.map(id=>{ const fs = list.filter(f=>f[1]===id && f[3]>=from && f[3]<=to); if (!fs.length) return '';
    const marks = fs.map((f,i)=>`<i class="fl-m ${f[4]}" style="left:${pctX(f[3],from,to)}%" title="${f[2]} · ${fmtD(f[3])}"></i>${labels?`<i class="fl-t ${f[4]} ${i%2?'dn':'up'}${pctX(f[3],from,to)>72?' lt':''}" style="left:${pctX(f[3],from,to)}%">${fshort(f)} · ${fmtD(f[3])}</i>`:''}`).join('');

  return laneFrame(rows, from, to, labels ? 14 : 'month', 'gt fl' + (labels?' lab':''));

function voteChart(h=150){
  const days = 15, max = 120, X = i => px(i, days)*10, Y = v => (1-v/max)*100;
  const done = VOTE.days, last = done.length-1, proj = [done[last], 70, 77, 83, 88, 92, 95, 97, 99];
  const q = VOTE.elig*VOTE.quorum, qi = done.findIndex(v=>v>=q);
  const paths = `<line x1="0" x2="1000" y1="${Y(q)}" y2="${Y(q)}" class="ch-floor"/>
    <path d="M${done.map((v,i)=>`${X(i)},${Y(v)}`).join(' L')}" class="ch-l1" style="stroke:var(--live)"/>
    <path d="M${proj.map((v,i)=>`${X(last+i)},${Y(v)}`).join(' L')}" class="ch-l3"/>`;
  const xs = [0,3,6,9,14].map(i=>({t:fmtD(VOTE.open+i*DAY), x:px(i,days)}));
  return '<div class="vc">' + chart({h, max, yTicks:[0,47,94], yFmt:v=>v?String(v):'0', x:xs, paths,
    marks:[{x:px(last,days), v:done[last], c:'var(--live)'},{x:px(qi,days), v:done[qi], c:'var(--fg)'}], notes:[{x:px(qi,days), t:'Quorum'}]}) + '</div>'
    + mkey([['var(--live)','Votes cast'],['var(--fg-50)','Expected by close'],['var(--fg)','Quorum · 47']]);
}

/* squarified treemap, in percent of a box */
function treemap(items, W=100, H=62){
  items = items.slice().sort((a,b)=>b.v-a.v); const tot = items.reduce((a,b)=>a+b.v,0), out = [];
  let x = 0, y = 0, w = W, h = H, row = [], area = it => it.v/tot*W*H;
  const worst = (r, side) => { const s = r.reduce((a,b)=>a+area(b),0); return Math.max(...r.map(it=>Math.max(side*side*area(it)/(s*s), (s*s)/(side*side*area(it))))); };
  const lay = r => { const s = r.reduce((a,b)=>a+area(b),0);
    if (w >= h){ const cw = s/h; let cy = y; r.forEach(it=>{ const ch = area(it)/cw; out.push({...it, x, y:cy, w:cw, h:ch}); cy += ch; }); x += cw; w -= cw; }
    else { const ch = s/w; let cx = x; r.forEach(it=>{ const cw = area(it)/ch; out.push({...it, x:cx, y, w:cw, h:ch}); cx += cw; }); y += ch; h -= ch; } };
  items.forEach(it=>{ const side = Math.min(w,h); if (!row.length || worst([...row,it], side) <= worst(row, side)) row.push(it); else { lay(row); row = [it]; } });
  if (row.length) lay(row);
  return `<div class="tm" style="aspect-ratio:${W}/${H}">${out.map(r=>{ const st = DSTATE_N[r.k];
    return `<button type="button" class="tm-c" data-rdf="${r.k}" style="left:${r.x/W*100}%;top:${r.y/H*100}%;width:${r.w/W*100}%;height:${r.h/H*100}%;--c:${DT[r.k][1]}">
      <b>${DT[r.k][0]}</b><span class="num">${r.v}</span>${st[1]||st[2]?`<em>${st[1]?st[1]+' draft':''}${st[1]&&st[2]?' · ':''}${st[2]?st[2]+' waiting':''}</em>`:''}</button>`; }).join('')}</div>`;
}

function heat(){

  const v = Array.from({length:days},(_,i)=>{ const d = new Date(start+i*DAY).getUTCDay(), we = d===0||d===6; const ramp = 0.35 + i/days;
    return Math.round((we ? 2 : 9)*ramp + r()*(we?3:8)); });
  const max = Math.max(...v), first = new Date(start).getUTCDay();
  const weeks = Math.ceil((days+((first+6)%7))/7);
  const cells = Array.from({length:weeks*7},(_,k)=>{ const i = k - ((first+6)%7); if (i<0 || i>=days) return '<i class="hx-c off"></i>';
    const t = start+i*DAY; return `<i class="hx-c${t===TODAY?' today':''}" style="--v:${v[i]/max}" title="${fmtD(t)} · ${v[i]} actions"></i>`; }).join('');
  const mlabels = Array.from({length:weeks},(_,wk)=>{ const t = start + (wk*7 - ((first+6)%7))*DAY; const d = new Date(t); return d.getUTCDate()<=7 ? `<span style="grid-column:${wk+1}">${MON[d.getUTCMonth()]}</span>` : ''; }).join('');
  return {html:`<div class="hx" style="--wk:${weeks}"><div class="hx-m">${mlabels}</div><div class="hx-d"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span></div><div class="hx-g">${cells}</div></div>

}

 /* ── views: what a group sees. S.view is set when a member signs in, or when an admin previews a group ── */
const VSEC = ['home','growth','field','members','merchants','shop','money','contracts','governance','records','team'];
function vLevel(r){
  if (!S.view || typeof ROLES==='undefined') return 4; const a = S.view.levels || ROLES[S.view.g][2];
  if (r==='more') return 1; if (r==='waiting') return Math.max(...a)>=3 ? a[0] : 0;
  const i = VSEC.indexOf(r); return i<0 ? 1 : a[i];
}
const vRO = () => !!S.view && Math.max(...(S.view.levels || ROLES[S.view.g][2])) < 3;
function vBar(){
  if (!S.view) return ''; const g = ROLES[S.view.g], lv = vLevel(S.route);

  const what = lv===1 ? 'Co-op totals only · names and personal details stay hidden' : lv===2 ? 'Read-only on this page' : lv===3 ? 'You can propose here · someone else approves' : 'Full access here';
  return `<div class="vbar"><span class="vbar-k"><span class="dot"></span><b>${S.view.preview?'Previewing':'You have'} the ${g[0]} view</b><span class="quiet">${what}</span></span>${S.view.preview?`<button type="button" class="vbar-x" data-viewexit>Exit preview</button>`:''}</div>`;
}

function setWho(n, role){ const w = document.querySelector('.who'); if (!w) return; w.querySelector('.av').textContent = n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase(); w.querySelector('.who-n').innerHTML = `<b style="font-weight:600">${n}</b> <span class="quiet">· ${role}</span>`; }
function toast(msg, act){ let t = document.getElementById('toast'); if (!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.innerHTML = `<span>${msg}</span>${act?`<button type="button">${act.label}</button>`:''}`; t.classList.toggle('act', !!act);
  if (act) t.querySelector('button').onclick = () => { t.classList.remove('on'); act.fn(); };

/* in a read-only view, anything that would change something is stopped before it runs; opening and reading still work */
const V_OK = /^data-(go|\w*pane|close\w*|cm\w*|merchant|member|person|product|poster|doc|rentry|scrim|pf\w*|rail\w*|viewexit|sgn|agr|ctr|nacct|copy|sort\w*|x?sort|mo|cal\w*|theme\w*)$/;

  if (vLevel(S.route)===1 && el.closest('[data-member]')){ e.preventDefault(); e.stopPropagation(); return toast('Names stay hidden in this view · co-op totals only'); }
  const ok = [...el.attributes].some(a=>V_OK.test(a.name));

/* Totals: co-op numbers only. Person-level tabs are hidden, member names and emails are blanked, member records don't open.
   The live API does this on the server; this is the same rule shown in the prototype. */
const V_PERSONAL_TABS = ['Forms','Orders','Accounts'];
let V_NAMES = null;
function vScrub(root){
  root.querySelectorAll('.ptabs button').forEach(b=>{ if (V_PERSONAL_TABS.includes(b.textContent.trim())) b.hidden = true; });
  if (!V_NAMES){ const staff = (typeof PEOPLE_T!=='undefined' ? PEOPLE_T.map(p=>p.n) : []).join('|');
    V_NAMES = { re:new RegExp(`\\b(${FIRST.join('|')}) (${LAST.join('|')}|[A-Z]\\.)`, 'g'), staff:new RegExp(`^(${staff})$`), mail:/[\w.+-]+@[\w-]+\.[\w.]+/g }; }
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while ((n = w.nextNode())){ const v = n.nodeValue; if (!/[A-Z@]/.test(v)) continue;
    const out = v.replace(V_NAMES.re, m => V_NAMES.staff.test(m) ? m : 'A member').replace(V_NAMES.mail, 'hidden'); if (out !== v) n.nodeValue = out; }

document.addEventListener('change', e => { if (e.target.id === 'f-photo' && e.target.files.length){ const l = document.getElementById('f-photo-l'); if (l) l.textContent = 'Photo added'; e.target.parentElement.querySelector('.fphoto').classList.add('on'); } });

/* ── Sign in: passkey first, a code by email as the fallback (Privy in the live app). Staff on the team list only. ── */
const SG = {step:'start', email:'', keep:true, t:null, left:0, who:null, view:null};
const KEY = '<svg class="i" viewBox="0 0 20 20" aria-hidden="true"><circle cx="7" cy="10" r="3.5"/><path d="M10.5 10H17M14.5 10v3M17 10v2.5"/></svg>';
function sgnArt(){ /* the squares motif, decorative: a band of people and shops */
  const rows = 12, cols = 24, n = rows*cols, cut = [.36,.43,.62]; let h = '';
  for (let i=0;i<n;i++){ const f = i/n; h += `<i class="${f<cut[0]?'a':f<cut[1]?'b':f<cut[2]?'c':''}"></i>`; }
  return `<div class="sgn-art" style="--r:${rows}" aria-hidden="true">${h}</div>`; }
function sgnBody(){
  const s = SG.step;
  if (s==='passkey') return `<div class="sgn-hd"><span class="lbl">Passkey</span><h1 class="h1">Confirm it’s you.</h1><p>Use your fingerprint, face or device PIN when your browser asks.</p></div>
    <div class="sgn-wait"><span class="dot pulse"></span><span><b>Waiting for your passkey</b><span class="small quiet">This page moves on by itself</span></span></div>
    <div class="sgn-row"><button type="button" class="sgn-link" data-sgn="back">Use a code by email instead</button></div>`;
  if (s==='code' || s==='verify') return `<div class="sgn-hd"><span class="lbl">Check your email</span><h1 class="h1">Enter the code.</h1><p>We sent a 6-digit code to <b style="color:var(--fg)">${SG.email}</b>. It works for 10 minutes.</p></div>
    <div class="sgn-f"><div class="sgn-code" id="sgnCode">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" autocomplete="${i?'off':'one-time-code'}" maxlength="1" aria-label="Digit ${i+1}"${s==='verify'?' disabled':''}>`).join('')}</div>
      ${s==='verify'?`<div class="sgn-wait"><span class="dot pulse"></span><span><b>Checking the code</b><span class="small quiet">Then you’re in</span></span></div>`:''}
      <div class="sgn-row"><button type="button" class="sgn-link" data-sgn="back">Use a different email</button><button type="button" class="sgn-link" data-sgn="resend" id="sgnResend" disabled>Resend in 0:30</button></div></div>`;
  if (s==='terms') return `<div class="sgn-hd"><span class="lbl">Data room · first sign-in</span><h1 class="h1">Before you look.</h1><p>You have read-only access to Clear’s numbers, contracts, votes and records until 21 Nov. It’s shared with you in confidence.</p></div>
    <div class="sgn-kv sgn-terms"><span>Keep it confidential</span><span>Don’t share or copy what you see</span><span>What’s logged</span><span>Every page you open</span><span>Access ends</span><span>21 Nov, unless Clear extends it</span><span>Questions</span><span>kai@useclear.org</span></div>
    <div class="sgn-f"><button type="button" class="btn btn-p" data-sgn="terms-ok">I agree · open the data room</button><button type="button" class="sgn-link" data-sgn="back" style="align-self:flex-start">Not now</button></div>`;
  if (s==='done') return SG.who ? `<div class="sgn-hd"><span class="lbl">Signed in · ${ROLES[SG.view.g][0]}</span><h1 class="h1">Welcome, ${SG.who}.</h1><p>${SG.view.g==='members'?'You have the member view: co-op totals, contracts, votes and records. Read-only.':SG.view.g==='investors'?'You have the data room: co-op numbers, contracts, votes and records. Read-only.':`You have ${ROLES[SG.view.g][0]} access.`}</p></div>`
    : `<div class="sgn-hd"><span class="lbl">Signed in · Admin</span><h1 class="h1">Welcome back, Kai.</h1><p>Opening the Command Center.</p></div>`;
  return `<div class="sgn-hd"><span class="lbl">Clear co-op</span><h1 class="h1">Sign in to the Command Center.</h1><p>Use your Clear app login. Every member gets a read-only view; the team sees what their group allows.</p></div>
    <div class="sgn-f"><button type="button" class="btn btn-p" data-sgn="passkey">${KEY}Sign in with a passkey</button>
      <div class="sgn-or small">or</div>
      <form class="sgn-f" id="sgnForm" novalidate><label class="sgn-in" id="sgnIn"><span class="lbl">Email on your Clear account</span><input id="sgnEmail" type="email" autocomplete="username" placeholder="you@example.com" value="${SG.email}"><span class="sgn-err">Enter your email.</span></label>
        <button type="submit" class="btn btn-g">Email me a code</button></form>
      <label class="sgn-keep"><input type="checkbox" id="sgnKeep"${SG.keep?' checked':''}>Keep me signed in on this device for 12 hours</label></div>`;
}
function sgnDraw(){
  const root = document.getElementById('loginRoot');
  root.innerHTML = `<div class="sgn" role="main"><div class="sgn-l"><div class="sgn-brand">${document.querySelector('.brand svg').outerHTML}<b>Command Center</b><span class="chip underway"><span class="dot"></span>Testnet</span></div>
    <div class="sgn-mn" aria-live="polite">${sgnBody()}</div>
    <div class="sgn-ft"><span>Every sign-in is logged with the device and place</span></div></div>
    <aside class="sgn-r">${sgnArt()}<div class="sgn-facts"><span class="lbl">Before you sign in</span><div class="sgn-kv">
      <span>Who can sign in</span><span>Every member, and the team</span><span>How</span><span>Your Clear app login</span>
      <span>Members see</span><span>Totals, contracts, votes, records</span><span>Investors and lenders</span><span>The same, as a data room</span><span>The team sees</span><span>What their group allows</span>
      <span>Money and on-chain actions</span><span>Always need a second person</span></div></div></aside></div>`;
  if (SG.step==='code'){ const ins = root.querySelectorAll('#sgnCode input'); ins[0].focus(); sgnTimer(30); }
}
function sgnTimer(n){ clearInterval(SG.t); SG.left = n; const tick = () => { const b = document.getElementById('sgnResend'); if (!b){ clearInterval(SG.t); return; } if (SG.left<=0){ b.disabled = false; b.textContent = 'Resend the code'; clearInterval(SG.t); return; } b.disabled = true; b.textContent = `Resend in 0:${String(SG.left).padStart(2,'0')}`; SG.left--; }; tick(); SG.t = setInterval(tick, 1000); }
function sgnStep(s){ SG.step = s; sgnDraw(); }
function sgnIn(){ if (SG.view && SG.view.terms) return sgnStep('terms');
  sgnStep('done'); setTimeout(()=>{ hideLogin();
  if (SG.view){ S.view = Object.assign({preview:false}, SG.view); setWho(SG.view.who, ROLES[SG.view.g][0].replace(/s$/,'')); } else { S.view = null; setWho('Kai', 'Admin'); }
  go(S.view ? (vLevel('home')>0 ? 'home' : 'growth') : 'home'); }, 1100); }
function showLogin(){ closeModal(); closePf && closePf(); SG.step = 'start'; SG.who = null; SG.view = null; S.view = null; document.body.classList.add('signed-out'); sgnDraw(); try { history.replaceState(null,'','#login'); } catch(e){} }
function hideLogin(){ document.body.classList.remove('signed-out'); document.getElementById('loginRoot').innerHTML = ''; clearInterval(SG.t); }
(() => {
  const root = document.getElementById('loginRoot');
  root.addEventListener('click', e => { const b = e.target.closest('[data-sgn]'); if (!b) return; const k = b.dataset.sgn;
    if (k==='terms-ok'){ const tp = PEOPLE_T.find(p=>p.id===SG.view.person); if (tp) tp.terms = 1; SG.view.terms = false; return sgnIn(); }
    if (k==='passkey'){ SG.who = null; SG.view = null; sgnStep('passkey'); setTimeout(()=>{ if (SG.step==='passkey') sgnIn(); }, 1800); }
    if (k==='back') sgnStep('start');
    if (k==='resend'){ sgnTimer(30); } });
  root.addEventListener('change', e => { if (e.target.id==='sgnKeep') SG.keep = e.target.checked; });
  root.addEventListener('submit', e => { e.preventDefault(); const v = (document.getElementById('sgnEmail').value||'').trim().toLowerCase(); SG.email = v;
    if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/.test(v)){ const l = document.getElementById('sgnIn'); l.classList.add('bad'); l.querySelector('.sgn-err').textContent = v ? 'That doesn’t look like an email.' : 'Enter your email.'; return; }
    /* one login for everyone: a person on the team list gets their group (or custom) access, anyone else with a Clear account is a member */
    const tp = PEOPLE_T.find(p=>p.email===v && !p.off);
    SG.view = tp ? (tp.role==='admin' ? null : {g:tp.role, who:tp.n.split(' ')[0], levels:accOf(tp), person:tp.id, terms:tp.role==='investors' && !tp.terms})
      : {g:'members', who:(v.split('@')[0].split(/[._-]/)[0].replace(/^./, c=>c.toUpperCase()) || 'Member')};
    SG.who = SG.view ? SG.view.who : null;
    sgnStep('code'); });
  root.addEventListener('input', e => { const t = e.target;
    if (t.id==='sgnEmail'){ document.getElementById('sgnIn').classList.remove('bad'); return; }
    if (!t.closest('#sgnCode')) return; const ins = [...root.querySelectorAll('#sgnCode input')], i = ins.indexOf(t);
    const d = t.value.replace(/\D/g,''); if (d.length > 1){ d.slice(0,6-i).split('').forEach((c,k)=>{ ins[i+k].value = c; }); } else t.value = d;
    const next = ins.find(x=>!x.value); if (next) next.focus(); else { sgnStep('verify'); ins.forEach((x,k)=>{ const n = document.querySelectorAll('#sgnCode input')[k]; if (n) n.value = x.value; }); setTimeout(sgnIn, 1100); } });
  root.addEventListener('keydown', e => { const t = e.target; if (!t.closest || !t.closest('#sgnCode') || e.key!=='Backspace' || t.value) return; const ins = [...root.querySelectorAll('#sgnCode input')], i = ins.indexOf(t); if (i>0){ ins[i-1].value = ''; ins[i-1].focus(); e.preventDefault(); } });
})();

const start = (location.hash || '').slice(1);
go(NAMES[start] ? start : 'home');
if (start==='login') showLogin();
})();
