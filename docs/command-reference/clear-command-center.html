<meta charset="utf-8">
<title>Clear Command Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell (top bar, left rail, bottom tabs on phone) around a flat, connected bento.
   Every component is header / main / footer. Lines touch; no gutters. Paper is the default. */
:root{
  --ground:#DFE3DE;          /* paper */
  --raised:#E9ECE7;          /* paper-2 */
  --fg:#16211D;              /* ink */
  --fg-70:rgb(22 33 29 / .70);
  --fg-50:rgb(22 33 29 / .66);
  --line:rgb(22 33 29 / .28);
  --hair:rgb(22 33 29 / .13);
  --live:#24409E;
  --settled:#0E6B4E;
  --underway:#8A5512;
  --absent:#9B2C22;
  --land:#6B7F5C;
  --btn-bg:#16211D;
  --btn-fg:#DFE3DE;
  --btn-dot:#6FCB9F;
  --scrim:rgb(22 33 29 / .42);
  --skel:rgb(22 33 29 / .08);

  --f-display:'Bricolage Grotesque', system-ui, sans-serif;
  --f-text:'Instrument Sans', system-ui, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, monospace;

  --s1:8px; --s2:16px; --s3:24px; --s4:40px; --s5:64px; --s6:96px;
  --ease:cubic-bezier(0.16, 1, 0.3, 1);
  --hover:200ms;
  --bar:64px;   /* top bar band */
  --rail:248px;
}
:root[data-theme="dark"]{
  --ground:#16211D;
  --raised:#1E2C27;
  --fg:#DFE3DE;
  --fg-70:rgb(223 227 222 / .70);
  --fg-50:rgb(223 227 222 / .66);
  --line:rgb(223 227 222 / .28);
  --hair:rgb(223 227 222 / .13);
  --live:#7C8CC5;
  --settled:#6FCB9F;
  --underway:#E3B667;
  --absent:#E58C7F;
  --land:#6B7F5C;
  --btn-bg:#DFE3DE;
  --btn-fg:#16211D;
  --btn-dot:#0E6B4E;
  --scrim:rgb(9 14 12 / .62);
  --skel:rgb(223 227 222 / .08);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--ground);color:var(--fg);margin:0}
body{font:400 15px/1.55 var(--f-text);-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ground)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
svg.i.sm{width:16px;height:16px}

/* ── Type roles ─────────────────────────────────────────── */
.lbl{font:400 11.5px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--fg-70)}
.h1{font:800 40px/1 var(--f-display);letter-spacing:-.038em;margin:0;text-wrap:balance}
.h2{font:800 28px/1.02 var(--f-display);letter-spacing:-.035em;margin:0;text-wrap:balance}
.sub{font:600 19px/1.15 var(--f-display);letter-spacing:-.02em;margin:0}
.fig{font-family:var(--f-text);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fig-xl{font-size:44px;line-height:1}
.fig-l{font-size:28px;line-height:1.05}
.fig-m{font-size:19px;line-height:1.2}
.quiet{color:var(--fg-70)}
.small{font-size:13px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}

/* ── Controls ───────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 var(--s3);border-radius:999px;font-weight:500;font-size:15px;border:1px solid transparent;transition:background var(--hover) var(--ease),border-color var(--hover) var(--ease),opacity var(--hover) var(--ease);white-space:nowrap}
.btn-p{background:var(--btn-bg);color:var(--btn-fg)}
.btn-p:hover{opacity:.88}
.btn-g{border-color:var(--line)}
.btn-g:hover{border-color:var(--fg)}
.btn .i{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{height:30px;padding:0 var(--s2);border-radius:999px;font-size:13px;font-weight:500;color:var(--fg-70);transition:background var(--hover) var(--ease),color var(--hover) var(--ease);white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--ground)}
.chip{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 var(--s1);border-radius:999px;border:1px solid currentColor;font:500 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.chip.live{color:var(--live)} .chip.underway{color:var(--underway)} .chip.settled{color:var(--settled)} .chip.absent{color:var(--absent)} .chip.plain{color:var(--fg-70);border-color:var(--line)}
.dot{position:relative;display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 6px 1px color-mix(in srgb,currentColor 55%,transparent);flex:none}
.chip .dot{width:6px;height:6px;box-shadow:0 0 4px 1px color-mix(in srgb,currentColor 45%,transparent)}
.dot.pulse::after{content:"";position:absolute;inset:0;border-radius:inherit;background:inherit;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}75%,100%{transform:scale(3.4);opacity:0}}
.dot-ok{color:var(--settled)}

/* ── Shell ──────────────────────────────────────────────── */
.app{min-height:100vh;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:var(--bar) 1fr}
.top{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);border-bottom:1px solid var(--line);display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:var(--bar)}
.brand{display:flex;align-items:center;gap:var(--s1);padding:0 var(--s3);border-right:1px solid var(--line);min-width:0}
.brand svg{width:24px;height:24px;flex:none}
.brand b{font:600 17px/1 var(--f-display);letter-spacing:-.02em;white-space:nowrap}
.top-main{display:flex;align-items:center;gap:var(--s2);padding:0 var(--s4);min-width:0}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:var(--s1);height:40px;padding:0 var(--s2);background:var(--raised);border:1px solid var(--line);color:var(--fg-70);min-width:0}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--fg);outline:none}
.search input::placeholder{color:var(--fg-50)}
.search kbd{font:400 11.5px/1 var(--f-mono);border:1px solid var(--line);padding:3px 6px;color:var(--fg-70)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}
.who{display:flex;align-items:center;gap:var(--s1)}
.who .av{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);font:500 11.5px/1 var(--f-mono)}

.rail{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));height:calc(100vh - var(--bar) - env(safe-area-inset-top,0px));border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
.rail-main{flex:1;padding:var(--s2) 0}
.rail-g{padding:var(--s2) var(--s3) var(--s1)}
.nav{display:flex;align-items:center;gap:var(--s2);width:100%;height:40px;padding:0 var(--s3);color:var(--fg-70);font-weight:500;transition:color var(--hover) var(--ease),background var(--hover) var(--ease)}
.nav:hover{color:var(--fg);background:var(--raised)}
.nav[aria-current="page"]{color:var(--fg);background:var(--raised);box-shadow:inset 2px 0 0 var(--fg)}
.nav .n{margin-left:auto;font:500 11.5px/1 var(--f-mono);color:var(--fg)}
.rail-ft{border-top:1px solid var(--line)}
.rail-ft button{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:64px;padding:var(--s1) var(--s3);color:var(--fg-70);font-size:13px}
.rail-ft button:hover{color:var(--fg)}
.rail-ft .dot{color:var(--underway)}
/* metrics strip: four columns in one cell */
.mx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.mx-c{display:flex;flex-direction:column;min-width:0;padding:var(--s3) var(--s3) var(--s2)}
.mx-c + .mx-c{border-left:1px solid var(--hair)}
.mx-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s1);min-width:0} .mx-h .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-t{font:400 10px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-50);white-space:nowrap}
.mx-f{font:600 34px/1.05 var(--f-text);letter-spacing:-.02em;margin-top:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mx-s{font-size:13px;color:var(--fg-70);margin-top:6px;min-height:2.6em;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mx-b{display:flex;align-items:flex-end;gap:3px;height:40px;margin-top:12px;border-bottom:1px solid var(--line)} .mx-b i{flex:1;display:block;background:color-mix(in srgb,var(--fg) 20%,transparent)} .mx-b i.now{background:var(--fg)}
@media (max-width:1180px){ .mx{grid-template-columns:repeat(2,minmax(0,1fr))} .mx-c:nth-child(3){border-left:0} .mx-c:nth-child(n+3){border-top:1px solid var(--hair)} }
@media (max-width:760px){ .mx-c{padding:var(--s2)} .mx-f{font-size:26px} .mx-t{display:none} .mx-b{height:28px} }
/* members, one square each */
.uc{--ur:6;display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--ur),auto);grid-auto-columns:minmax(0,1fr);gap:3px}
.c-fig:has(> .figsub.two){flex-direction:row;align-items:center;gap:20px}
.figsub.two{display:flex;flex-direction:column;gap:2px} .figsub.two > span:first-child{color:var(--fg)}
.uc-q{display:block;aspect-ratio:1;width:100%;background:var(--c);min-width:0}
.uc-q.invited{background:none;box-shadow:inset 0 0 0 1.5px var(--fg-50)} .uc-q.quiet{background:none;box-shadow:inset 0 0 0 1.5px var(--line);background-image:repeating-linear-gradient(45deg,var(--line) 0 1px,transparent 1px 4px)}
button.uc-q:hover{outline:2px solid var(--fg);outline-offset:1px}
.c-body:has(> .uc-k){container-type:inline-size}
@container (max-width:720px){ .uc-k{display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr))} }
@container (max-width:460px){ .uc-k{grid-template-columns:repeat(2,minmax(0,1fr))} }
.uc-k{display:flex;justify-content:space-between;gap:12px;margin-top:var(--s1);border-top:1px solid var(--hair);padding-top:var(--s2)}
.uc-kr{display:grid;grid-template-columns:14px auto minmax(0,max-content);justify-content:start;align-items:center;column-gap:10px;min-width:0}
.uc-kr > i{grid-column:1;grid-row:1;width:14px;height:14px} .uc-kr > span{grid-column:3;grid-row:1} .uc-kr > span{display:flex;flex-direction:column;gap:1px;min-width:0} .uc-kr > span > *{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .uc-kr b{font-weight:600;font-size:13px}
.uc-kr > b.num{grid-column:2;grid-row:1;font-size:19px;line-height:1}
.uc-kr.hl > b.num{color:var(--land)}
@media (max-width:760px){ .uc{--ur:12;gap:2px} .uc-k{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:var(--s2)} }
/* partner corridor */
.cm-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.cm-host{position:relative;height:480px;background:var(--raised);overflow:hidden}
.cm-slot,.cm-gl,.cm-gl.maplibregl-map{position:absolute;inset:0}
.cm-gl canvas{filter:saturate(.35) sepia(.1) contrast(.96)}
:root[data-theme="dark"] .cm-gl canvas{filter:invert(.9) hue-rotate(180deg) saturate(.25) brightness(.9)}
.cm-host{--cml:color-mix(in srgb,var(--fg) 4%,var(--ground))}
.cm-fb{position:absolute;inset:0;container-type:size;background:var(--cml)}
.cm-host.live .cm-fb{display:none} .cm-host:not(.live) .cm-slot{visibility:hidden} .cm-host:not(.live) .cm-zoom{display:none}
.cm-stage{position:absolute;left:50%;top:50%;width:min(calc(100cqw - 80px),calc((100cqh - 80px) * var(--a)));aspect-ratio:var(--a);transform:translate(-50%,-50%)}
.cm-base{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cm-base path{fill:none;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.cm-base .hl{fill:color-mix(in srgb,var(--fg) 5%,transparent)} .cm-base .hl.lo{fill:color-mix(in srgb,var(--fg) 3.5%,transparent)}
.cm-base .st{stroke:color-mix(in srgb,var(--fg) 6%,transparent);stroke-width:.7}
.cm-base .ar{stroke:var(--raised);stroke-width:1.8;opacity:.9}
.cm-base .wt{stroke:color-mix(in srgb,#5E86A0 38%,var(--cml));stroke-width:3.5}
.cm-base .fc{stroke:color-mix(in srgb,var(--fg) 16%,transparent);stroke-width:6.5} .cm-base .fw{stroke:var(--raised);stroke-width:4.5}
.cm-hw{position:absolute;transform:translate(-50%,-50%);font:500 9.5px/1 var(--f-mono);color:var(--fg-70);background:var(--raised);border:1px solid var(--line);padding:2px 4px;pointer-events:none}
.cm-fb .cm-pin{position:absolute}
.cm-s{display:inline-block;width:14px;height:14px;flex:none;box-sizing:border-box}
.cm-s.ck-tx{background:var(--fg)} .cm-s.ck-sg{background:var(--live)} .cm-s.ck-si{background:color-mix(in srgb,var(--fg) 38%,transparent)} .cm-s.ck-pr{background:color-mix(in srgb,var(--fg) 14%,transparent)}
button.cm-s.ck-tx:hover{outline:2px solid var(--fg);outline-offset:2px}
.cm-key .cm-s{width:12px;height:12px}
.cm-pin{position:relative;width:0;height:0}
.cm-dot{position:absolute;left:-6px;top:-6px;width:12px;height:12px;background:var(--ground);box-shadow:inset 0 0 0 2px var(--fg),0 0 0 2px var(--ground);z-index:1} .cm-dot.t{background:var(--fg)}
.cm-lab{position:absolute;display:flex;flex-direction:column;gap:8px;width:156px;box-sizing:border-box;padding:9px 10px 10px;background:var(--ground);border:1px solid var(--line);text-align:left;cursor:pointer;box-shadow:0 8px 20px -12px rgb(0 0 0 / .35)}
.cm-lab:hover{border-color:var(--fg-50)}
.cm-lt2{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.cm-lt2 > b{font-weight:600;font-size:12.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-lt2 > .num{font:500 11px/1 var(--f-mono);color:var(--fg-50);flex:none} .cm-lt2 > .num b{font-weight:500;color:var(--fg)}
.cm-bar{display:flex;gap:2px;height:8px} .cm-bar i{flex:0 1 8px;min-width:0}
.cm-bar .ck-tx{background:var(--fg)} .cm-bar .ck-sg{background:var(--live)} .cm-bar .ck-si{background:color-mix(in srgb,var(--fg) 38%,transparent)} .cm-bar .ck-pr{background:color-mix(in srgb,var(--fg) 14%,transparent)}
.cm-lab::after{content:'';position:absolute;background:var(--fg-50)}
.cm-pin.n .cm-lab{bottom:14px;left:50%;transform:translateX(-50%)} .cm-pin.n .cm-lab::after{top:100%;left:50%;width:1px;height:9px}
.cm-pin.s .cm-lab{top:14px;left:50%;transform:translateX(-50%)} .cm-pin.s .cm-lab::after{bottom:100%;left:50%;width:1px;height:9px}
.cm-pin.e .cm-lab{left:14px;top:50%;transform:translateY(-50%)} .cm-pin.e .cm-lab::after{right:100%;top:50%;height:1px;width:9px}
.cm-pin.w .cm-lab{right:14px;top:50%;transform:translateY(-50%)} .cm-pin.w .cm-lab::after{left:100%;top:50%;height:1px;width:9px}
.cm-pin.on .cm-lab{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg),0 10px 22px -12px rgb(0 0 0 / .5)} .cm-pin.on .cm-lab::after{background:var(--fg)} .cm-pin.on .cm-dot{background:var(--live);box-shadow:inset 0 0 0 2px var(--live),0 0 0 2px var(--ground)}
.cm-pin:hover{z-index:3}
.cm-pin.hid .cm-lab{opacity:0;pointer-events:none;transition:opacity .12s} .cm-pin.hid:hover .cm-lab{opacity:1} .cm-dot{cursor:pointer} .cm-dot::after{content:'';position:absolute;inset:-9px}
.cm-zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;background:var(--ground);border:1px solid var(--line);z-index:2}
.cm-zoom button{display:grid;place-items:center;width:32px;height:32px;font:500 16px/1 var(--f-text);color:var(--fg-70)} .cm-zoom button + button{border-top:1px solid var(--hair)} .cm-zoom button:hover{color:var(--fg);background:var(--raised)}
.maplibregl-map{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent} .maplibregl-canvas{position:absolute;left:0;top:0}
.maplibregl-canvas-container.maplibregl-interactive{cursor:grab} .maplibregl-canvas-container.maplibregl-interactive:active{cursor:grabbing}
.maplibregl-marker{position:absolute;top:0;left:0;will-change:transform}
.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-top-right,.maplibregl-ctrl-top-left{position:absolute;z-index:2;pointer-events:none} .maplibregl-ctrl-bottom-right{right:0;bottom:0}
.maplibregl-ctrl{pointer-events:auto} .maplibregl-ctrl-attrib{font:400 9.5px/1.5 var(--f-mono);background:color-mix(in srgb,var(--ground) 85%,transparent);padding:2px 6px;color:var(--fg-50)} .maplibregl-ctrl-attrib a{color:inherit} .maplibregl-ctrl-attrib-button{display:none}
/* the city list beside the map */
.cm-side{display:flex;flex-direction:column;border-left:1px solid var(--hair);min-width:0;height:480px}
.cm-sh{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 var(--s3);border-bottom:1px solid var(--hair);flex:none} .cm-sh .aside{color:var(--fg-50)}
.cm-list{flex:1;overflow:auto;scrollbar-width:thin}
.cm-lr{border-bottom:1px solid var(--hair)} .cm-lr.on{box-shadow:inset 3px 0 0 var(--fg)}
.cm-lh{display:grid;grid-template-columns:minmax(0,1fr) auto 16px;align-items:center;gap:14px;width:100%;min-height:60px;padding:0 var(--s3);text-align:left}
.cm-lh:hover{background:var(--raised)} .cm-lr.on .cm-lh{background:var(--raised)}
.cm-lt{display:flex;flex-direction:column;gap:3px;min-width:0} .cm-lt b{font-weight:600;font-size:14px} .cm-lt .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-lc{display:flex;justify-content:flex-end;gap:5px;font:500 13px/1 var(--f-text);font-variant-numeric:tabular-nums;white-space:nowrap} .cm-lc > :first-child{color:var(--fg)} .cm-lc > :last-child{color:var(--fg-50)}
.cm-lh .i{color:var(--fg-50);transition:transform var(--hover) var(--ease)} .cm-lr.on .cm-lh .i{transform:rotate(90deg);color:var(--fg)}
.cm-ld{display:none;padding:4px 0 14px} .cm-lr.on .cm-ld{display:block}
.cm-g + .cm-g{margin-top:6px}
.cm-gh{display:flex;align-items:center;gap:10px;height:34px;padding:0 var(--s3)} .cm-gh .cm-s{width:10px;height:10px} .cm-gh .num{margin-left:auto;color:var(--fg)}
.cm-li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--s2);width:100%;height:32px;padding:0 var(--s3) 0 calc(var(--s3) + 20px);font-size:13px;text-align:left}
.cm-ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .cm-li .quiet{font-size:12.5px;white-space:nowrap}
button.cm-li:hover{background:var(--raised)} button.cm-li .num{font-weight:500}
.cm-key{padding:var(--s2) var(--s3)} .c-body:has(> .cm-wrap){gap:0}
.c-fig:has(+ .c-body > .cm-wrap){padding-bottom:var(--s3)} .c-body:has(> .cm-wrap){padding-top:0}
@media (max-width:1180px){ .cm-wrap{grid-template-columns:minmax(0,1fr) 280px} .cm-lab{width:132px;padding:8px 9px 9px} }

   wider screens keep that layout so the list has room to grow past four. */
.nowwrap{container-type:inline-size}
.bento.now{grid-template-columns:minmax(0,1fr)}
.bento.now > .cell{grid-column:auto}
.btn-s{height:32px;padding:0 var(--s2);font-size:14px;gap:var(--s1);justify-content:center}
.zone .z-body{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.zone .z-body > *{flex:1}
.zone .z-empty{padding:var(--s3);display:flex;flex-direction:column;gap:var(--s1)}

/* needs you: icon tile, what it is, then amount over the action */
.nlist{display:grid;grid-template-columns:minmax(0,1fr);margin-bottom:-1px}
.nrow{display:grid;grid-template-columns:40px minmax(0,1fr) 96px;column-gap:var(--s2);align-items:center;min-height:96px;padding:var(--s2) var(--s3);border-bottom:1px solid var(--hair)}
.ntile{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);color:var(--fg-70)}
.nrow.urgent .ntile{border-color:var(--live);color:var(--live)}
.nmain{display:flex;flex-direction:column;gap:4px;min-width:0}
.ntitle{font:600 15px/1.3 var(--f-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nmeta{font-size:13px;line-height:1.4;color:var(--fg-70)}
.nmeta em{font-style:normal;font-weight:500;color:var(--live)}
.nend{display:flex;flex-direction:column;align-items:stretch;gap:var(--s1);text-align:right}
.nend .fig{font-size:19px;line-height:1.1;white-space:nowrap}
.nend .fig small{font-size:13px;font-weight:400;color:var(--fg-70);margin-left:4px}
.nend .btn{width:100%}

/* moving: rows share the height evenly so the column fills */
.mvlist{display:flex;flex-direction:column}
.mv{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--s1);width:100%;min-height:88px;padding:var(--s2) var(--s3);border-bottom:1px solid var(--hair);transition:background var(--hover) var(--ease)}
.mv:last-child{border-bottom:0}
.mv:hover{background:var(--raised)}
.mv-t{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2)}
.mv-t b{font:600 15px/1.3 var(--f-text)}
.mv .fig{font-size:19px}
.segs{display:flex;gap:2px;height:8px}
.segs i{flex:1;display:block}

/* changed: a timeline you skim */
.feed{list-style:none;margin:0;padding:var(--s1) 0;position:relative}
.feed::before{content:"";position:absolute;left:28px;top:32px;bottom:40px;border-left:1px solid var(--line)}
.feed button{display:grid;grid-template-columns:10px minmax(0,1fr);column-gap:var(--s2);row-gap:2px;width:100%;padding:var(--s2) var(--s3);transition:background var(--hover) var(--ease)}
.feed button:hover{background:var(--raised)}
.feed .node{grid-row:1/4;width:10px;height:10px;margin-top:2px;background:var(--ground);border:1px solid var(--fg);position:relative;z-index:1}
.feed .node.on{background:var(--fg)}
.feed .when{font:400 11.5px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--fg-50)}
.feed .what{font:400 14px/1.4 var(--f-text)}
.feed .what b{font-weight:600}
.pips{display:flex;flex-wrap:wrap;gap:3px;max-width:200px}
.pips i{display:block;width:10px;height:10px}
@container (min-width:720px){
  .bento.now{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bento.now > .cell:first-child{grid-column:1/-1}
  .nlist{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nlist .nrow:nth-child(odd){border-right:1px solid var(--hair)}
}
@container (max-width:479px){
  .nrow{grid-template-columns:minmax(0,1fr) 96px;padding:var(--s2)}
  .ntile{display:none}
  .mv,.feed button{padding:var(--s2)}
  .feed::before{left:20px}
}
/* card visuals */
.c-kind{display:flex;align-items:center;gap:var(--s1);color:var(--fg-70);min-width:0}
.mcomp{display:flex;height:8px;gap:2px}
.mcomp span{display:block;height:100%}
.mkey{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);font-size:13px;color:var(--fg-70)}
.mkey span{display:inline-flex;align-items:center;gap:var(--s1);white-space:nowrap}
.mkey .sw{margin:0}
.track{display:flex;align-items:center}
.track .ln{width:16px;height:1px;background:var(--line);flex:none}
.track .nd{min-width:32px;height:28px;padding:0 var(--s1);display:grid;place-items:center;font:500 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);color:var(--fg-70)}
.track .nd.on{border-color:var(--fg);color:var(--fg)}
.track .nd.cur{background:var(--fg);border-color:var(--fg);color:var(--ground)}
.track .nd.wait{border-color:var(--underway);color:var(--underway)}
.scale{position:relative;height:40px;margin:0 var(--s2) 0 var(--s1)}
.scale .base{position:absolute;left:0;right:0;top:8px;border-top:1px solid var(--line)}
.scale .span{position:absolute;top:7px;height:3px;background:var(--fg)}
.scale .tk{position:absolute;top:2px;width:1px;height:13px;background:var(--fg-50)}
.scale .mk{position:absolute;top:3px;width:10px;height:10px;transform:translateX(-50%);background:var(--fg)}
.scale .lb{position:absolute;top:22px;transform:translateX(-50%);font:400 11.5px/1 var(--f-mono);color:var(--fg-50);white-space:nowrap}
.scale .lb.now{color:var(--fg)}
.mspark{width:100%;max-width:200px;height:40px;display:block}
.mspark path{fill:none;stroke:var(--fg);stroke-width:1.5;vector-effect:non-scaling-stroke}
/* ── Shop ── */
.pn-r > .ev-d:first-child{min-width:48px}
.sp-g{display:inline-grid;place-items:center;width:40px;height:40px;flex:none;color:var(--fg)}
.sp-g svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.sp-g.sm{width:24px;height:24px} .sp-g.sm svg{stroke-width:1.8}
.sp-g.xl{width:72px;height:72px;border:1px solid var(--hair)} .sp-g.xl svg{width:80%;height:80%;stroke-width:1.2}
.sp-g.arch{color:var(--fg-50)}
.sp-hd{display:flex;align-items:center;gap:var(--s2)}
.hide-s{} @media (max-width:760px){ .hide-s{display:none !important} }
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.rs-g{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px} .rs-f input{text-align:center;padding-left:4px;padding-right:4px}

/* where each dollar goes */
.wfl{--yw:40px;display:flex;flex-direction:column;padding-top:22px}
.wfl-p{position:relative;height:280px;margin-left:var(--yw);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.wfl-g{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--hair)}
.wfl-g span{position:absolute;right:calc(100% + 8px);top:0;transform:translateY(-50%);font:400 10px/1 var(--f-mono);color:var(--fg-50);white-space:nowrap}
.wfl-c{position:relative;height:100%}
.wfl-b{position:absolute;left:16%;right:16%;display:block;min-height:2px}
.wfl-b.tot{background:var(--fg)} .wfl-b.keep{background:var(--land)}
.wfl-b.neg{background:repeating-linear-gradient(45deg,var(--underway) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1.5px var(--underway)}
.wfl-v{position:absolute;left:0;right:0;transform:translateY(-6px);text-align:center;font:600 12.5px/1 var(--f-text);font-variant-numeric:tabular-nums;white-space:nowrap}
.wfl-v.neg{color:var(--underway)} .wfl-v.keep{color:var(--fg)}
.wfl-j{position:absolute;left:84%;width:32%;height:0;border-top:1px dashed var(--fg-50);z-index:1}
.wfl-x{margin-left:var(--yw);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding-top:10px}
.wfl-x span{font:400 10px/1.25 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--fg-50);text-align:center}
.wfl-x span:last-child{color:var(--fg);font-weight:500}
.sb{display:flex;flex-direction:column;gap:var(--s3)}

/* weekly stack */
.sc8 .mcol-s{padding:0 16%}
.sc8 .mcol.now .ck{color:var(--fg)}
.sc-notes{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;margin-top:6px;min-height:28px}
.sc-notes span{display:flex;flex-direction:column;align-items:center;gap:4px;font:400 10px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--fg-70);text-align:center}
.sc-notes i{width:1.5px;height:8px;background:var(--fg-50)}

/* price ladder */
.ld{display:flex;flex-direction:column}
.ld-r{display:grid;grid-template-columns:130px minmax(0,1fr) 48px;align-items:center;gap:var(--s2);min-height:46px;border-top:1px solid var(--hair);width:100%;text-align:left;font-size:13px}
.ld-r:first-child{border-top:0}
button.ld-r:hover .ld-k b{text-decoration:underline;text-underline-offset:3px}
.ld-k{min-width:0} .ld-k b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ld-b{position:relative;height:14px;display:block}
.ld-t{display:flex;height:100%;gap:1px} .ld-t i{display:block;height:100%}
.ld-m{background:var(--hair);box-shadow:inset 0 0 0 1px var(--line)}
.ld-b em{position:absolute;top:50%;transform:translate(8px,-50%);font:600 12px/1 var(--f-text);font-style:normal;font-variant-numeric:tabular-nums;white-space:nowrap}
.ld-r > b{text-align:right;font-weight:600}
.ld-ax{display:grid;grid-template-columns:130px minmax(0,1fr) 48px;gap:var(--s2);padding-top:6px}
.ld-axl{position:relative;height:12px} .ld-axl span{position:absolute;top:0;transform:translateX(-50%);font:400 10px/1 var(--f-mono);color:var(--fg-50)} .ld-axl span:first-child{transform:none}
.ld-one .ld-b{height:16px}

/* margin and volume */
.spt{display:grid;grid-template-columns:40px minmax(0,1fr);grid-template-rows:240px auto;margin-top:var(--s1)}
.spt-y{position:relative} .spt-y span{position:absolute;right:8px;transform:translateY(50%);font:400 10px/1 var(--f-mono);color:var(--fg-50)}
.spt-p{position:relative;border-left:1px solid var(--line);border-bottom:1px solid var(--line);margin-right:76px}
.spt-g{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--hair)} .spt-gv{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--hair)}
.spt-d{position:absolute;width:var(--r);height:var(--r);transform:translate(-50%,50%);z-index:1}
.spt-d i{position:absolute;inset:0;background:var(--c);box-shadow:0 0 0 2px var(--ground)}
.spt-d span{position:absolute;top:50%;left:calc(100% + 6px);transform:translateY(-50%);font-size:12px;white-space:nowrap;background:color-mix(in srgb,var(--ground) 85%,transparent);padding:1px 2px}
.spt-d span.l{left:auto;right:calc(100% + 6px)}
.spt-d:hover span{text-decoration:underline;text-underline-offset:3px}
.spt-x{grid-column:2;position:relative;height:18px;margin-right:76px} .spt-x span{position:absolute;top:6px;transform:translateX(-50%);font:400 10px/1 var(--f-mono);color:var(--fg-50)} .spt-x span:first-child{transform:none}
.spt-cap{display:flex;justify-content:space-between;padding:6px 76px 0 40px;font:400 10px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--fg-50)}

/* stock grid */
.sg{display:flex;flex-direction:column}
.sg-r{display:grid;grid-template-columns:minmax(150px,1.5fr) 100px repeat(6,minmax(34px,1fr)) 60px;align-items:center;gap:4px;min-height:40px;width:100%;text-align:left;font-size:13px}
.sg-r.first{border-top:1px solid var(--hair);padding-top:4px;margin-top:4px}
.sg-r.sg-h{min-height:26px;align-items:end;padding-bottom:4px} .sg-h span{font:400 10px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-50);text-align:center} .sg-h span:nth-child(-n+2){text-align:left}
.sg-h span:last-child{text-align:right}
.sg-h + .sg-r.first{border-top:0;margin-top:0}
button.sg-r:hover .sg-k b{text-decoration:underline;text-underline-offset:3px}
.sg-k{min-width:0} .sg-k b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-col{display:flex;align-items:center;gap:8px;min-width:0;color:var(--fg-70);white-space:nowrap}
.sw-c{width:12px;height:12px;flex:none;box-shadow:inset 0 0 0 1px var(--line)} .sw-c.black{background:#1B1D1C} .sw-c.white{background:#FBFAF6} .sw-c.cobalt{background:#2D4FB0}
.sg-c{display:grid;place-items:center;height:32px;background:color-mix(in srgb,var(--fg) calc(var(--a) * 42%),transparent)}
.sg-c b{font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.sg-c.lo{box-shadow:inset 0 0 0 1.5px var(--underway)} .sg-c.lo b{color:var(--underway)}
.sg-c.z{background:none;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--absent) 60%,transparent)} .sg-c.z b{color:var(--absent)}
.sg-r > b{text-align:right;font-weight:600}
.sg-c.q{background:none;box-shadow:inset 0 0 0 1px var(--hair)} .sg-c.q b{color:var(--fg-50);font-weight:400}
.sg-k4{box-shadow:inset 0 0 0 1px var(--line)}
.sg-r.draft{opacity:.55}
.sg-k1,.sg-k2,.sg-k3,.sg-k4{display:inline-block;width:12px;height:12px;flex:none}
.sg-k1{background:linear-gradient(90deg,color-mix(in srgb,var(--fg) 6%,transparent),color-mix(in srgb,var(--fg) 42%,transparent));width:28px}
.sg-k2{box-shadow:inset 0 0 0 1.5px var(--underway)} .sg-k3{box-shadow:inset 0 0 0 1.5px var(--absent)}
.sg-mini .sg-r{grid-template-columns:96px repeat(6,minmax(0,1fr)) 40px;min-height:38px}
.sg-mini .sg-c{height:30px}

/* cover */
.cvb{display:flex;flex-direction:column}
.cvb-r{width:100%;text-align:left;min-height:40px;border-top:1px solid var(--hair)} .cvb-r:first-child{border-top:0}
button.cvb-r:hover .wb-k{text-decoration:underline;text-underline-offset:3px}
.cvb-r .wb-b{overflow:visible}
.cvb-out{position:absolute;left:0;top:50%;transform:translateY(-50%);font:500 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--absent);white-space:nowrap}
.cvb-r > b.warn{color:var(--underway)}
.cvb .wb-ax{padding-top:6px}

/* incoming and shelf lanes */
.ln-l > i.in-s,.ln-l > i.sh{height:10px;transform:translateY(-50%)}
.in-s.done{background:var(--fg)} .in-s.make{background:var(--fg-50)}
.in-s.ship{background:repeating-linear-gradient(45deg,var(--fg) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1px var(--fg)}
.ln-l > i.in-s.plan,.ln-l > i.sh.draft,.ln-l > i.sh.proj{height:0}
.in-s.plan{border-top:2px dashed var(--fg-50)}
.gb-tag.in{color:var(--fg)}
.sh.on{background:var(--fg)}
.sh.off{background:repeating-linear-gradient(45deg,var(--underway) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1.5px var(--underway)}
.sh.draft{border-top:2px dotted var(--fg-50)} .sh.proj{border-top:2px dashed var(--fg)}
.ln-l > i.sh-x{width:10px;height:10px;transform:translate(-50%,-50%);background:var(--ground);box-shadow:inset 0 0 0 2px var(--fg-50)}
.in-k,.sh-k{display:inline-block;width:18px;height:10px;flex:none}
.in-k.done,.sh-k.on{background:var(--fg)} .in-k.make{background:var(--fg-50)}
.in-k.ship{background:repeating-linear-gradient(45deg,var(--fg) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1px var(--fg)}
.in-k.plan{height:0;border-top:2px dashed var(--fg-50)}
.sh-k.off{background:repeating-linear-gradient(45deg,var(--underway) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1.5px var(--underway)}
.sh-k.draft{height:0;border-top:2px dotted var(--fg-50)} .sh-k.proj{height:0;border-top:2px dashed var(--fg)} .sh-k.x{width:10px;box-shadow:inset 0 0 0 2px var(--fg-50)}
.sh-ln .ln-r,.sh-ln .ln-l{min-height:46px} .in-ln .ln-r,.in-ln .ln-l{min-height:60px}

/* catalog */
.cat{display:flex;flex-direction:column}
.cat-r{display:grid;grid-template-columns:44px minmax(0,1.8fr) 96px 130px 96px 104px 110px;align-items:center;gap:var(--s2);min-height:68px;border-top:1px solid var(--hair);width:100%;text-align:left;font-size:13px}
.cat-r.cat-h{border-top:0;min-height:28px;align-items:end;padding-bottom:6px} .cat-h span{font:400 10px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-50)}
button.cat-r:hover .cat-k b{text-decoration:underline;text-underline-offset:3px}
.cat-k{display:flex;flex-direction:column;gap:3px;min-width:0} .cat-k > *{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .cat-k b{font-weight:600;font-size:14px}
.cat-p,.cat-s{display:flex;flex-direction:column;gap:3px} .cat-p b,.cat-s b{font-weight:600}
.cat-s b.warn{color:var(--absent)}
.cat-m{display:grid;grid-template-columns:minmax(0,1fr) 40px;align-items:center;gap:var(--s1)} .cat-m b{text-align:right;font-weight:600}
.cat-mb{height:8px;background:var(--hair);display:flex} .cat-mb i{display:block;background:var(--fg)}
.cat-w{display:flex;align-items:flex-end;gap:3px;height:28px;border-bottom:1px solid var(--line)} .cat-w i{display:block;flex:1;max-width:9px;background:var(--fg-50)} .cat-w i.now{background:var(--fg)}
.cat-c{display:flex;justify-content:flex-end}
.cat-r.arch{color:var(--fg-70)} .cat-r.arch .cat-w i{background:var(--hair)}

/* fulfilment */
.flow5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.f5-c{display:flex;flex-direction:column;gap:6px;padding:var(--s1) var(--s3) var(--s2);border-left:1px solid var(--hair);text-align:left;min-height:168px;min-width:0}
.f5-c:first-child{border-left:0;padding-left:0}
.f5-c .fig{margin-top:4px} .f5-c .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f5-c.hot .fig{color:var(--live)}
button.f5-c:hover > .lbl{text-decoration:underline;text-underline-offset:3px}
.f5-a{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:var(--s1);min-height:22px;align-items:flex-end}
.f5-a i,.f5-k{display:inline-block;width:14px;height:14px;background:var(--line);flex:none}
.f5-a i.mid,.f5-k.mid{background:var(--fg-50)} .f5-a i.old,.f5-k.old{background:var(--underway)}
.f5-a .small{width:100%}
.f5-bar{display:flex;width:100%;height:10px;background:var(--land)} .f5-bar i{display:block;background:var(--fg)}

/* orders */
.or{display:flex;flex-direction:column}
.or-r{display:grid;grid-template-columns:56px minmax(0,1.6fr) 72px minmax(0,1fr) 56px 84px 140px;align-items:center;gap:var(--s2);min-height:66px;border-top:1px solid var(--hair);width:100%;text-align:left;font-size:13px}
.or-r.or-h{border-top:0;min-height:28px;align-items:end;padding-bottom:6px} .or-h span{font:400 10px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-50)}
.or-h span:nth-child(6){text-align:right}
button.or-r:hover .or-k b{text-decoration:underline;text-underline-offset:3px}
.or-id{font-size:12px;color:var(--fg-70)}
.or-k{display:flex;flex-direction:column;gap:3px;min-width:0} .or-k > *{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .or-k b{font-weight:600}
.or-m{display:inline-block;margin-left:8px;padding:2px 5px;border:1px solid var(--line);font:400 9.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-70);vertical-align:2px}
.or-g{display:flex;gap:2px}
.or-w{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.or-r > b{text-align:right;font-weight:600}
.or-c{display:flex;justify-content:flex-end}

/* pre-orders */
.po{display:flex;flex-direction:column;margin-bottom:var(--s2)}
.po-r{display:grid;grid-template-columns:minmax(0,1fr) auto 112px;align-items:center;gap:var(--s2);min-height:56px;border-top:1px solid var(--hair);font-size:13px}

function spark(vals, emph, prev){
  const W = 600, H = 150, pad = 6, max = Math.max(...vals, ...(prev||[])) * 1.1;
  const x = (i,n) => pad + i * (W - pad*2) / (n - 1);
  const y = v => H - pad - v / max * (H - pad*2);
  const pts = vals.map((v,i) => `${x(i,vals.length).toFixed(1)},${y(v).toFixed(1)}`);
  const ppts = prev ? prev.map((v,i) => `${x(i,prev.length).toFixed(1)},${y(v).toFixed(1)}`) : null;
  const lx = x(vals.length-1,vals.length), ly = y(vals[vals.length-1]);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Visits over the period, with the period before as a dashed line">
    <line class="grid" x1="0" x2="${W}" y1="${H-pad}" y2="${H-pad}"/><line class="grid" x1="0" x2="${W}" y1="${(H/2).toFixed(1)}" y2="${(H/2).toFixed(1)}"/>
    <path class="area" d="M${pad},${H-pad} L${pts.join(' L')} L${lx.toFixed(1)},${H-pad} Z"/>
    ${ppts?`<path class="ghost" d="M${ppts.join(' L')}"/>`:''}
    <path class="ln" d="M${pts.join(' L')}"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5" style="fill:${emph?'var(--live)':'var(--fg)'};stroke:var(--ground);stroke-width:2"/>
  </svg>`;
}

function syncPages(){
  const st = $('#strip'), dots = $('#dots'); if (!st || !dots) return;
  const pages = Math.max(1, Math.round(st.scrollWidth / st.clientWidth));
  const cur = Math.min(pages - 1, Math.round(st.scrollLeft / st.clientWidth));
  if (dots.childElementCount !== pages){
    dots.innerHTML = Array.from({length:pages},(_,i)=>`<button type="button" data-page="${i}" aria-label="Page ${i+1} of ${pages}"></button>`).join('');
  }
  dots.style.visibility = pages < 2 ? 'hidden' : 'visible';
  [...dots.children].forEach((d,i)=>d.setAttribute('aria-current', String(i===cur)));
  const [prev, next] = document.querySelectorAll('.p-nav button');
  if (prev){ prev.disabled = cur === 0; next.disabled = cur >= pages - 1; }
}
let pageRaf = 0;
document.addEventListener('scroll', e => { if (e.target.id === 'strip'){ cancelAnimationFrame(pageRaf); pageRaf = requestAnimationFrame(syncPages); } }, true);
window.addEventListener('resize', () => requestAnimationFrame(syncPages));

function numbers(cobaltFree, alerts){
  const d = RANGE[S.range];
  const fTot = d.forms.reduce((a,b)=>a+b,0);
  const C = ['var(--fg)','var(--land)','var(--fg-50)','var(--line)'];
  const when = S.range === 'today' ? 'today' : 'in ' + d.name;
  const F = (n, sub) => `<span class="fig fig-xl">${n}</span><span class="figsub">${sub}</span>`;
  const G = (label, aside, body) => `<div class="group"><div class="g-lbl"><span class="lbl">${label}</span>${aside?`<span class="lbl aside">${aside}</span>`:''}</div>${body}</div>`;

  /* Traffic */
  const visits = cell({span:'s-8', label:'Site visits', tag: S.range==='today' ? '<span class="dot pulse" aria-hidden="true"></span>Live' : d.name,
    fig:F(int(d.visits), d.delta),
    main:`<div>${spark(d.spark, cobaltFree, d.prev)}<div class="axis" style="margin-top:8px">${d.axis.map(a=>`<span>${a}</span>`).join('')}</div></div>
      <div class="key"><span><i></i>${d.name}</span><span><i class="d"></i>${d.prevName}</span></div>`,
    foot:[{t:`Top page ${d.page[0]} · ${int(d.page[1])}`, go:'growth'},{t:'Synced 1 min ago'}]});
  const forms = cell({span:'s-4', label:'Forms', tag:d.name,
    fig:F(int(fTot), `submitted ${when}`),
    main:compBar(d.forms.map((v,i)=>[FORMS[i], v, C[i]])),
    foot:[{t:'All forms', go:'growth'}]});
  const sources = cell({span:'s-4', label:'Sources', tag:d.name,
    fig:F(pct(d.src[0], d.visits), 'of visits came from a poster'),
    main:compBar(['Posters','Direct','Social','Search'].map((k,i)=>[k, d.src[i], C[i]]))});
  const jr = +(d.forms[0]/d.visits*100).toFixed(1), dj = (jr - d.joinPrev).toFixed(1);
  const join = cell({span:'s-4', label:'Join rate', tag:d.name,
    fig:F(jr.toFixed(1)+'%', `of visits joined · ${dj>=0?'up':'down'} ${Math.abs(dj)} pts`),
    main:`${vizScale(d.joinPrev, jr, 2, 5, d.joinPrev.toFixed(1)+'%', jr.toFixed(1)+'%')}
      ${mkey([['var(--fg-50)', d.prevName], ['var(--fg)', d.name]])}
      <div class="how two">${[['Joins', int(d.forms[0])],['Visits', int(d.visits)]].map(([k,v])=>`<span class="k">${k}</span><b class="num">${v}</b>`).join('')}</div>`});
  const CITY = ['Redlands','San Bernardino','Riverside','Elsewhere'];
  const cities = cell({span:'s-4', label:'Cities', tag:d.name,
    fig:F(pct(d.cities[0], d.visits), 'of visits from Redlands, the top city'),
    main:`<div class="how">${CITY.map((k,i)=>`<span class="k">${i===3?`<span class="quiet">${k}</span>`:k}</span><b class="num">${int(d.cities[i])}</b><span class="quiet num">${pct(d.cities[i], d.visits)}</span>`).join('')}</div>`});

  /* Poster launch */
  /* Funnel: one drawn shape, width shared with the step columns so they line up.
     Height follows the square root of each count, so a 50-to-1 drop stays readable. */
  const conv = FUNNEL.map((f,i)=> i ? f[1]/FUNNEL[i-1][1] : 1);
  const weak = conv.indexOf(Math.min(...conv.slice(1)));
  const hs = FUNNEL.map(f => Math.max(10, 112 * Math.sqrt(f[1]/FUNNEL[0][1])));
  const top = h => (60 - h/2).toFixed(1), bot = h => (60 + h/2).toFixed(1), T = 14;
  let up = [], dn = [];
  hs.forEach((h,i)=>{ const x0 = i*100 + (i?T:0), x1 = (i+1)*100 - (i<5?T:0);
    up.push(`${x0},${top(h)}`, `${x1},${top(h)}`); dn.unshift(`${x1},${bot(h)}`, `${x0},${bot(h)}`); });
  const shape = `<svg class="fshape" viewBox="0 0 600 120" preserveAspectRatio="none" role="img" aria-label="Funnel from 36,410 visits to 109 first spends">
      <polygon points="${up.join(' ')} ${dn.join(' ')}" style="fill:var(--line)"/>
      <rect x="501" y="${top(hs[5])}" width="99" height="${hs[5].toFixed(1)}" style="fill:var(--fg)"/>
      ${[1,2,3,4,5].map(i=>`<line x1="${i*100}" x2="${i*100}" y1="0" y2="120" style="stroke:var(--ground);stroke-width:2;vector-effect:non-scaling-stroke"/>`).join('')}
    </svg>`;
  const convTxt = i => i ? `${ic('arr','xs')}${pct(FUNNEL[i][1],FUNNEL[i-1][1])}` : 'all sources';
  const funnel = cell({span:'s-7', label:'Funnel', tag:'Last 30 days',
    fig:F((109/36410*100).toFixed(2)+'%', 'of visits end in a first spend at a partner shop'),
    main:`<div class="fwrap">
        <div class="fwide">
          <div class="fcols">${FUNNEL.map(([k,v])=>`<div><span class="lbl">${k}</span><span class="fig fig-m">${int(v)}</span></div>`).join('')}</div>
          ${shape}
          <div class="fcols fconv">${FUNNEL.map((f,i)=>`<span class="cv${i===weak?' weak':''}">${convTxt(i)}</span>`).join('')}</div>
        </div>
        <div class="fnarrow">${FUNNEL.map(([k,v],i)=>`<div class="frow"><span class="lbl">${k}</span><span class="fig fig-m">${int(v)}</span>
          <span class="fband"><i style="width:${(hs[i]/112*100).toFixed(1)}%;background:${i===5?'var(--fg)':'var(--line)'}"></i></span><span class="cv${i===weak?' weak':''}">${convTxt(i)}</span></div>`).join('')}</div>
      </div>
      <div class="fkey"><span class="small quiet">Biggest drop is <b class="drop">visit to join</b>. 96 in every 100 visits leave without joining. 97 of the 109 first spends were a poster\u2019s $10.</span></div>`,
    foot:[{t:'By source', go:'growth'},{t:'Poster funnel by shop', go:'growth'}]});
  const how = [['Connected a bank',71],['Added $5',38],['Set up direct deposit',15]];
  const act = cell({span:'s-5', label:'Activation', tag:'Last 30 days',
    fig:F(pct(124,300), `of 300 invited · ${int(d.act)} activated ${when}`),
    main:`<div class="ablock"><span class="lbl">Where the 300 are</span>${compBar([['Activated',124,'var(--fg)'],['Opened, not funded',64,'var(--land)'],['Not opened yet',112,'var(--line)']])}</div>
      <div class="ablock"><span class="lbl">How the 124 activated</span><div class="how">${how.map(([k,v])=>`<span class="k">${k}</span><b class="num">${v}</b><span class="quiet num">${pct(v,124)}</span>`).join('')}</div></div>`,
    foot:[{t:'Nudge 64 people', go:'members'},{t:'90-day window', go:'members'}]});
  const others = d.scans - d.top.reduce((a,t)=>a+t[1],0);
  const tail = (() => { const n = 70, w = Array.from({length:n},(_,i)=>Math.exp(-i/22)); const sw = w.reduce((a,b)=>a+b,0), rest = others - n;
    const v = w.map(x => 1 + Math.floor(x/sw*rest)); let r = others - v.reduce((a,b)=>a+b,0); for (let i=0; r>0; i=(i+1)%n, r--) v[i]++; return v; })();
  const dist = [...d.top.map(t=>t[1]), ...tail, ...Array(102-3-tail.length).fill(0)].sort((a,b)=>b-a);
  const none = dist.filter(v=>!v).length, top10 = dist.slice(0,10).reduce((a,b)=>a+b,0);
  const dmax = dist[0], bw = 600/102;
  const distSvg = `<svg class="dist" viewBox="0 0 600 72" preserveAspectRatio="none" role="img" aria-label="Scans per poster, most to least. ${none} posters had none.">
    ${dist.map((v,i)=>{ const h = v ? Math.max(3, Math.sqrt(v/dmax)*70) : 1.5; return `<rect x="${(i*bw).toFixed(2)}" y="${(72-h).toFixed(1)}" width="${(bw-1.4).toFixed(2)}" height="${h.toFixed(1)}" style="fill:${i<3?'var(--fg)':v?'var(--line)':'var(--hair)'}"/>`; }).join('')}</svg>`;
  const scans = cell({span:'s-5', label:'Poster scans', tag:d.name,
    fig:F(int(d.scans), `scans ${when} · ${none} posters had none`),
    main:`<div>${distSvg}<div class="axis" style="margin-top:8px"><span>Most scanned</span><span>102 posters</span></div></div>
      <div class="how">${d.top.map(([n,v])=>`<span class="k"><i class="sw" style="background:var(--fg)"></i>${n}</span><b class="num">${int(v)}</b><span class="quiet num">${pct(v,d.scans)}</span>`).join('')}</div>
      <span class="small quiet">The top 10 posters bring ${pct(top10, d.scans)} of scans.</span>`,
    foot:[{t:'102 posters up', go:'growth'}]});
  const owed = S.payoutDone ? 390 : 430, shops = S.payoutDone ? 10 : 11;
  const owedRows = [['Mesa Laundry',8,'var(--fg)'],['Inland Cycle Works',6,'var(--fg)']];
  if (!S.payoutDone) owedRows.push(["Rosa’s Panadería",4,'var(--land)','in today’s payout']);
  owedRows.push(['8 more shops',25,'var(--line)']);
  const owedC = cell({span:'s-7', label:'$10 owed to shops', tag:'Redemptions',
    fig:F(money(owed), `owed to ${shops} shops · clears Mon 2 Nov`),
    main:`<div class="owe">${owedRows.map(([n,c,col,note])=>`<div class="orow"><span class="k">${n}${note?`<span class="quiet small"> · ${note}</span>`:''}</span>
        <span class="opips" aria-label="${c} redemptions">${Array.from({length:c},()=>`<i style="background:${col}"></i>`).join('')}</span><b class="num">${money(c*10)}</b></div>`).join('')}</div>
      <span class="small quiet">Each square is one $10 spent at that shop.</span>`,
    foot:[{t:`Paid ${money(S.payoutDone?580:540)} in Oct`, go:'merchants'},{t:'Next run Mon 2 Nov'}]});

  /* Watch */
  const fixHtml = a => a.fix==='resync' ? `<span class="afix"><span class="small quiet">Re-syncing 7/12</span>${segs([12,7,0])}</span>`
    : a.fix==='route' ? `<button class="btn btn-g btn-s" type="button" data-go="field">Add to route</button>`
    : `<button class="chip plain" type="button" data-go="waiting" style="height:24px">In Needs you</button>`;
  const high = alerts.filter(a=>a.sev==='absent').length;
  const al = cell({span:'s-5', label:'Alerts', tag: alerts.length ? 'Needs a look' : 'All clear', state: alerts.length ? 'underway' : 'settled',
    fig:F(String(alerts.length), alerts.length ? `open · ${high} high, ${alerts.length-high} to check` : 'open · every feed synced'),
    main: alerts.length ? `<div class="alist">${alerts.map(a=>`<div class="arow"><i class="sev" style="background:var(--${a.sev})" aria-label="${a.sev==='absent'?'High':'Check'}"></i>
        <button class="amain" type="button" data-go="${a.go}"><b>${a.t}</b><span class="small quiet">${a.area} · ${a.age}</span></button>${fixHtml(a)}</div>`).join('')}</div>
        ${mkey([['var(--absent)','High'],['var(--underway)','Check']])}`
                        : `<span class="small quiet">Nothing needs a look.</span>`,
    foot:[{t:'All alerts', go:'records'}]});
  const ready = DEADLINES.filter(x=>x[4]==='ready').length;
  const marks = DEADLINES.map(([t,e,dt,n,st],i)=>`<span class="mk ${st}" style="left:${n/30*100}%">${i+1}</span><span class="dt" style="left:${n/30*100}%">${dt}</span>`).join('');
  const dl = cell({span:'s-7', label:'Deadlines', tag:'Next 30 days',
    fig:F('11 days', `to the next filing · ${ready} of ${DEADLINES.length} ready`),
    main:`<div class="tl" role="img" aria-label="${DEADLINES.map(x=>x[0]+' on '+x[2]).join(', ')}"><span class="base"></span><span class="tick" style="left:0"></span><span class="tick" style="left:100%"></span>
        <span class="end" style="left:0">Today</span><span class="end" style="left:100%;transform:translateX(-100%)">20 Nov</span>${marks}</div>
      <div class="dlist">${DEADLINES.map(([t,e,dt,n,st],i)=>`<div class="drow"><span class="num-sq ${st}">${i+1}</span><span class="dmain"><b>${t}</b><span class="small quiet">${e} · ${dt} · ${n} days</span></span><span class="chip ${DL_STATUS[st][0]}">${DL_STATUS[st][1]}</span></div>`).join('')}</div>`,
    foot:[{t:'Compliance calendar', go:'governance'}]});

  return G('Traffic', '', `<div class="bento sub">${visits}${forms}${sources}${join}${cities}</div>`)
       + G('Funnel and posters', 'All sources · about 100 posters with $10 to spend at that shop', `<div class="bento sub">${funnel}${act}${scans}${owedC}</div>`)
       + G('Watch', '', `<div class="bento sub">${al}${dl}</div>`);
}

/* ══ Growth ══════════════════════════════════════════════════════════════
   Three panes: Funnel (by shop, by design), Posters (inventory, swaps), Site and forms.

/* Dates: demo "today" is Wed 21 Oct 2026 */
const TODAY = Date.UTC(2026,9,21);

/* Build the 102 posters once */
const POSTERS = (() => {
  const r = rng(41); const list = [];
  const split = (total, n) => { const w = Array.from({length:n},()=>0.6+r()); const sw = w.reduce((a,b)=>a+b,0);
    const v = w.map(x=>Math.floor(x/sw*total)); let k = total - v.reduce((a,b)=>a+b,0); for (let i=0;k>0;i=(i+1)%n,k--) v[i]++; return v; };
  SHOPS.forEach(s => split(s[3], s[2]).forEach(v => list.push({shop:s[1], shopId:s[0], city:s[7], scans:v})));
  const otherCounts = OTHER_SHOPS.map((_,i)=> i<8 ? 4 : 3);
  const otherScans = split(OTHERS[3], 68); let k = 0;
  OTHER_SHOPS.forEach((n,i)=>{ for (let j=0;j<otherCounts[i];j++) list.push({shop:n, shopId:'o'+i, city:OTHER_CITY[i], scans:otherScans[k++]}); });
  split(BOARDS[3], 6).forEach((v,i)=> list.push({shop:BOARD_SITES[i], shopId:'b'+i, city:BOARD_CITY[i], scans:v, board:true}));
  /* designs: 41 A, 38 B, 23 C */
  const des = [...Array(41).fill('A'), ...Array(38).fill('B'), ...Array(23).fill('C')];
  for (let i=des.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [des[i],des[j]] = [des[j],des[i]]; }
  list.forEach((p,i)=>{ p.n = i+1; p.design = des[i];
    p.hung = TODAY - (6 + Math.floor(r()*50))*DAY; p.checked = TODAY - Math.floor(r()*12)*DAY; p.status = 'up'; });
  /* P-044 is at Mesa Laundry (Home's alert), so swap numbers with Mesa's third poster */
  const mesa = list.filter(p=>p.shopId==='mesa')[2], p44 = list.find(p=>p.n===44); [mesa.n, p44.n] = [44, mesa.n];
  const byN = n => list.find(p=>p.n===n);
  [[44,'faded',-64],[71,'faded',-40],[90,'faded',-35],[63,'missing',-30]].forEach(([n,st,h])=>{ const p = byN(n); p.status = st; p.hung = TODAY + h*DAY; });
  [[12,-57],[27,-56],[55,-55],[81,-54]].forEach(([n,h])=>{ const p = byN(n); p.status = 'due'; p.hung = TODAY + h*DAY; });
  list.forEach(p=>{ p.swap = p.hung + 60*DAY; if (p.status==='up' && daysTo(p.swap) < 8) p.hung += 10*DAY, p.swap += 10*DAY; });
  byN(44).checked = TODAY - 2*DAY;
  return list.sort((a,b)=>a.n-b.n);
})();

function miniSpark(seed, total, n=14, w=96, h=24){
  const v = series(n, Math.max(total,n), i=>0.7+0.3*Math.sin((i+seed)/2.3)+0.02*i, seed+3);
  const max = Math.max(...v), min = Math.min(...v);
  const pts = v.map((y,i)=>`${(i/(n-1)*(w-2)+1).toFixed(1)},${(h-2-(y-min)/(max-min||1)*(h-4)).toFixed(1)}`);
  return `<svg class="tspark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="M${pts.join(' L')}"/></svg>`;
}

const REFS = [['instagram.com',4210],['google.com',7120],['nextdoor.com',2650],['facebook.com',2380],['tiktok.com',1830],['bing.com',1070]];
const LANDING = [['/join',11904,1012],['/',9880,121],['/s/ (posters)',4812,0],['/how',4120,74],['/shops',2310,0],['/contribute',1204,0],['/housing',1100,58],['/coop',1080,37]];
const HEAT = (()=>{ const r = rng(77); const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  return days.map((d,di)=>({d, v:Array.from({length:24},(_,h)=>{ const we = di>4;
    const base = 0.05 + Math.exp(-((h-(we?12:12.5))**2)/(we?10:4))*(we?1.15:.75) + Math.exp(-((h-19)**2)/5)*(we?.7:1);
    return Math.max(0, base*(0.85+0.3*r()) * (h<6?0.25:1)); })})); })();

function gAcquisition(){

  const uniq = W_VIS.map(v=>Math.round(v*.69)), jr = W_VIS.map((v,i)=>W_JOIN[i]/v*100), phone = [70.2,71.0,72.4,73.1,74.0,75.2,75.9,76.6,77.1,77.8,78.0,78.4];

  const srcCell = gCell('s-7', 'Sources', '30 days', figHtml(pct(best[2],best[1]), `join rate from ${best[0].toLowerCase()} · ${Math.round((best[2]/best[1])/((tot[1]-best[2])/(tot[0]-best[1])))}× every other source combined`),
    `<div class="flush-x">${srcTable}</div>`, `<div class="c-ft"><div class="row"><span class="t">Posters are 13% of visits and 85% of joins</span></div></div>`);

  const flat = HEAT.flatMap(d=>d.v), hmax = Math.max(...flat);
  let peak = {d:'',h:0,v:0}; HEAT.forEach(d=>d.v.forEach((v,h)=>{ if (v>peak.v) peak = {d:d.d,h,v}; }));
  const heat = `<div class="heat"><div class="hh"><span></span>${Array.from({length:24},(_,h)=>`<span>${h%6===0?String(h).padStart(2,'0'):''}</span>`).join('')}</div>
    ${HEAT.map(d=>`<div class="hr"><span>${d.d}</span>${d.v.map((v,h)=>`<i title="${d.d} ${String(h).padStart(2,'0')}:00" style="opacity:${(0.08+0.92*v/hmax).toFixed(2)}"></i>`).join('')}</div>`).join('')}
    <div class="hkey"><span>Quiet</span><i style="opacity:.1"></i><i style="opacity:.35"></i><i style="opacity:.6"></i><i style="opacity:1"></i><span>Busy</span></div></div>`;
  const heatCell = gCell('s-5', 'When they visit', 'Hour by day · 30 days', figHtml(`${peak.d} ${String(peak.h).padStart(2,'0')}:00`, 'busiest hour · evenings carry weekdays'), heat,
    `<div class="c-ft"><div class="row"><span class="t">Schedule posts and posters for 18:00 to 21:00</span></div></div>`);

  const dev = gCell('', 'Devices', '30 days', figHtml('78.4%', 'on a phone'), compBar([['Phone',28545,'var(--fg)'],['Desktop',6590,'var(--land)'],['Tablet',1275,'var(--line)']]));
  const ret = gCell('', 'New or returning', '30 days', figHtml('31.0%', 'of visits are a return visit'), compBar([['New',25123,'var(--fg)'],['Returning',11287,'var(--land)']]));
  const refMax = Math.max(...REFS.map(r=>r[1]));
  const rs = REFS.slice().sort((a,b)=>b[1]-a[1]);

    `<div class="how">${rs.map(([k,v])=>`<span class="k mono">${k}</span><b class="num">${int(v)}</b><span class="quiet num">${pct(v,tot[0])}</span>`).join('')}</div>`);

  const land = `<div class="tbl-wrap"><table class="tbl compact">

    <tbody>${LANDING.map(([p,v,j])=>`<tr><td class="l mono">${p}</td><td>${int(v)}</td><td class="quiet">${pct(v,tot[0])}</td><td>${j?int(j):'<span class="quiet">–</span>'}</td><td>${j?pct(j,v):'<span class="quiet">Hands off to /join</span>'}</td></tr>`).join('')}</tbody></table></div>`;
  const landCell = gCell('s-12', 'Landing pages', 'Where visits start · 30 days', figHtml('/join', `${pct(LANDING[0][1],tot[0])} of visits start here`), `<div class="flush-x">${land}</div>`);

  return G('At a glance', 'Last 30 days', '', metricsCell(kpis))
    + G('Sources and timing', 'Select a source for its pages', '', srcCell + heatCell)
    + G('Visitors', '', 'g3', dev + ret + refs)
    + G('Pages', '', '', landCell);
}
function miniSparkV(v, w=96, h=24){
  const max = Math.max(...v), min = Math.min(...v);
  const pts = v.map((y,i)=>`${(i/(v.length-1)*(w-2)+1).toFixed(1)},${(h-2-(y-min)/(max-min||1)*(h-4)).toFixed(1)}`);
  return `<svg class="tspark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="M${pts.join(' L')}"/></svg>`;
}

/* Shops: traffic against conversion, so each shop's next step is obvious */
/* Each shop is a numbered square; the numbers match the shop table and the list beside the chart,
   so no label ever has to sit next to a point and collide. */
const SHOP_NO = Object.fromEntries(SHOPS.map((s,i)=>[s[0], i+1]));
const scMid = () => ({mx: SHOPS.reduce((a,s)=>a+s[3]/s[2],0)/SHOPS.length, my: 1106/4812});
const scCorner = s => { const {mx,my} = scMid(), hi = s[3]/s[2] > mx, good = s[4]/s[3] > my;
  return hi && !good ? 'swap' : !hi && good ? 'add' : hi && good ? 'keep' : 'watch'; };
const SC_COL = {swap:'var(--underway)', add:'var(--settled)', keep:'var(--fg)', watch:'var(--fg-50)'};
const noSq = (s, solid) => `<span class="nsq ${scCorner(s)}${solid?' solid':''}">${SHOP_NO[s[0]]}</span>`;
function shopScatter(){
  const xMin = 60, xMax = 230, yMin = .10, yMax = .34, {mx,my} = scMid();
  const X = v => (v-xMin)/(xMax-xMin)*100, Y = v => (1-(v-yMin)/(yMax-yMin))*100;
  const yt = [.10,.15,.20,.25,.30], xt = [60,100,140,180,220];
  return `<div class="sc">
    <div class="sc-y"><b class="sc-yt">Join rate</b>${yt.map(v=>`<span style="top:${Y(v)}%">${Math.round(v*100)}%</span>`).join('')}</div>

      ${yt.map(v=>`<i class="sc-g" style="top:${Y(v)}%"></i>`).join('')}${xt.slice(1).map(v=>`<i class="sc-gv" style="left:${X(v)}%"></i>`).join('')}
      <i class="sc-avx" style="left:${X(mx)}%"></i><i class="sc-avy" style="top:${Y(my)}%"></i>
      <span class="sc-avl x" style="left:${X(mx)}%">Avg ${Math.round(mx)} scans</span><span class="sc-avl y" style="top:${Y(my)}%">Avg ${(my*100).toFixed(1)}%</span>
      <span class="sc-q tl"><i style="background:${SC_COL.add}"></i>Converts, needs traffic</span><span class="sc-q tr"><i style="background:${SC_COL.keep}"></i>Busy and converting</span>
      <span class="sc-q bl"><i style="background:${SC_COL.watch}"></i>Quiet, weak join</span><span class="sc-q br"><i style="background:${SC_COL.swap}"></i>Busy, weak join</span>
      ${SHOPS.map(s=>`<span class="sc-pt" style="left:${X(s[3]/s[2])}%;top:${Y(s[4]/s[3])}%" title="${s[1]}: ${(s[3]/s[2]).toFixed(0)} scans per poster, ${(s[4]/s[3]*100).toFixed(1)}% join">${noSq(s,true)}</span>`).join('')}
    </div>
    <div class="sc-x">${xt.map(v=>`<span style="left:${X(v)}%">${v}</span>`).join('')}<b>Scans per poster →</b></div>
  </div>`;
}

function gFunnel(){
  const rows = [...SHOPS, BOARDS, OTHERS].map(s=>({id:s[0], name:s[1], posters:s[2], scans:s[3], joined:s[4], act:s[5], spent:s[6], city:s[7], jr:s[4]/s[3]}));
  const tot = rows.reduce((a,r)=>({posters:a.posters+r.posters, scans:a.scans+r.scans, joined:a.joined+r.joined, act:a.act+r.act, spent:a.spent+r.spent}),{posters:0,scans:0,joined:0,act:0,spent:0});
  const ranked = rows.slice(0,10);
  const best = ranked.reduce((a,b)=>b.jr>a.jr?b:a), worst = ranked.reduce((a,b)=>b.jr<a.jr?b:a);
  const key = {scans:'scans', joined:'joined', jr:'jr', act:'act', spent:'spent', perposter:'pp'};
  rows.forEach(r=>r.pp = r.scans/r.posters);
  const sorted = [...rows.slice(0,10).sort((a,b)=>(a[key[GS.sort]]-b[key[GS.sort]])*GS.dir), ...rows.slice(10)];
  const th = (k,t) => `<button type="button" class="th${GS.sort===k?' on':''}" data-gsort="${k}">${t}${GS.sort===k?ic(GS.dir<0?'down':'up','xs'):''}</button>`;
  const D = Object.entries(DESIGNS);
  const bestD = D.reduce((a,b)=>b[1].joined/b[1].scans>a[1].joined/a[1].scans?b:a)[0];
  const mostD = D.reduce((a,b)=>b[1].scans/b[1].posters>a[1].scans/a[1].posters?b:a)[0];

  const shopTable = `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th class="l">Shop</th><th>Posters</th><th>${th('scans','Scans')}</th><th>${th('joined','Joined')}</th><th>${th('jr','Join rate')}</th><th>${th('act','Activated')}</th><th>${th('spent','$10 spent')}</th><th class="l">Last 14 days</th></tr></thead>
    <tbody>${sorted.map((r,i)=>`<tr class="${r.id==='boards'||r.id==='others'?'rest':''}">
      <td class="l"><span class="tshop">${SHOP_NO[r.id]?noSq(SHOPS.find(x=>x[0]===r.id)):'<span class="nsq blank"></span>'}<span><b>${r.name}</b><span class="quiet small">${r.city}</span></span></span></td><td>${r.posters}</td><td>${int(r.scans)}</td><td>${int(r.joined)}</td>
      <td class="${r===best?'good':r===worst?'weak':''}">${(r.jr*100).toFixed(1)}%</td><td>${r.act}</td><td>${r.spent}</td><td class="l">${miniSpark(i*3+1, r.scans/2)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td class="l"><b>All posters</b></td><td>${tot.posters}</td><td>${int(tot.scans)}</td><td>${int(tot.joined)}</td><td>${pct(tot.joined,tot.scans)}</td><td>${tot.act}</td><td>${tot.spent}</td><td></td></tr></tfoot>
  </table></div>`;

  const shopCell = `<section class="cell s-12"><header class="c-hd"><span class="lbl">Poster funnel per shop</span><span class="tag">Last 30 days</span></header>
    <div class="c-fig"></div><div class="c-body flush">${shopTable}</div>
    <div class="c-ft split">${footItem({t:`Best join rate: ${best.name}, ${(best.jr*100).toFixed(1)}%`})}<span class="rule" aria-hidden="true"></span>${footItem({t:`Lowest: ${worst.name}, ${(worst.jr*100).toFixed(1)}%. Try design A there`})}</div></section>`;

  const designCells = D.map(([k,d])=>{
    const jr = d.joined/d.scans, pp = d.scans/d.posters;
    return `<section class="cell">
      <header class="c-hd"><span class="lbl">Design ${k} · ${d.name}</span><span class="tag">${d.posters} posters</span></header>
      <div class="c-fig"><div class="dhead">${designThumb(k,48)}<div><span class="fig fig-xl">${(jr*100).toFixed(1)}%</span><span class="figsub">join rate</span></div></div></div>
      <div class="c-body"><div class="how two"><span class="k">Scans per poster</span><b class="num">${pp.toFixed(1)}</b><span class="k">Scans</span><b class="num">${int(d.scans)}</b><span class="k">Joined</span><b class="num">${int(d.joined)}</b></div>
        ${k===bestD?`<span class="chip settled" style="align-self:flex-start">Converts best</span>`:k===mostD?`<span class="chip plain" style="align-self:flex-start">Most scans per poster</span>`:`<span class="chip plain" style="align-self:flex-start">Fewest scans</span>`}</div>
      <div class="c-ft"><button type="button" data-gpane="posters"><span class="t">See its ${d.posters} posters</span>${ic('chev','sm')}</button></div></section>`;
  }).join('');

  const mx = SHOPS.reduce((a,s)=>a+s[3]/s[2],0)/SHOPS.length, my = 1106/4812;
  const q = (hi, good) => SHOPS.filter(s=>(s[3]/s[2]>mx)===hi && (s[4]/s[3]>my)===good).map(s=>s[1]);
  const scatter = `<section class="cell s-8"><header class="c-hd"><span class="lbl">Traffic against join rate</span><span class="tag">Top 10 shops · last 30 days</span></header>
    <div class="c-fig"><span class="fig fig-xl">${(best.jr*100).toFixed(1)}%</span><span class="figsub">best join rate, at ${best.name} · average ${(my*100).toFixed(1)}%</span></div>
    <div class="c-body">${shopScatter()}</div>
    <div class="c-ft"><div class="row"><span class="t">Dashed lines are the averages · numbers match the shop table</span></div></div></section>`;
  const grp = k => SHOPS.filter(s=>scCorner(s)===k);
  const block = (k, title, act) => `<div class="cg-blk"><div class="cg-hd"><i style="background:${SC_COL[k]}"></i><b>${title}</b><span class="small quiet">${act}</span></div>

  const corners = `<section class="cell s-4"><header class="c-hd"><span class="lbl">What to do</span><span class="tag">By corner</span></header>
    <div class="c-fig"><span class="fig fig-xl">${grp('swap').length + grp('add').length}</span><span class="figsub">shops with a clear next step</span></div>
    <div class="c-body">${block('swap','Busy, weak join','Swap to design A')}${block('add','Converts, needs traffic','Add posters')}${block('keep','Busy and converting','Keep as is')}${block('watch','Quiet, weak join','Watch for two weeks')}</div>
    <div class="c-ft"><button type="button" data-move="swap"><span class="t">Plan the swap at Redlands Tire</span>${ic('chev','sm')}</button></div></section>`;
  return `<div class="group"><div class="g-lbl"><span class="lbl">Shops at a glance</span><span class="lbl aside">Each square is a shop</span></div><div class="bento sub">${scatter}${corners}</div></div>
    <div class="group"><div class="g-lbl"><span class="lbl">By shop</span><span class="lbl aside">Starts at the poster scan · select a column to sort</span></div><div class="bento sub">${shopCell}</div></div>
    <div class="group"><div class="g-lbl"><span class="lbl">By poster design</span><span class="lbl aside">${DESIGNS[mostD].name} pulls scans · ${DESIGNS[bestD].name} turns them into joins</span></div>
      <div class="bento sub dgrid">${designCells}</div></div>`;
}

/* ── Dropdown: a listbox, never the system menu. Arrows move, Enter chooses, Escape closes. ── */
function ddHtml(id, opts, cur, aria){
  const sel = opts.find(o=>o[0]===cur) || opts[0];
  return `<div class="dd" data-dd="${id}"><button class="dd-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="${aria}: ${sel[1]}">
      <span>${sel[1]}</span><b>${sel[2]}</b>${ic('chevd','sm')}</button>
    <ul class="dd-list" role="listbox" aria-label="${aria}" hidden>${opts.map(([v,t,c])=>`<li role="option" tabindex="-1" data-ddv="${v}" aria-selected="${v===cur}">
      <span class="dd-ck">${v===cur?ic('check','sm'):''}</span><span>${t}</span><b>${c}</b></li>`).join('')}</ul></div>`;
}
function ddClose(){ document.querySelectorAll('.dd-list:not([hidden])').forEach(l=>{ l.hidden = true; l.previousElementSibling.setAttribute('aria-expanded','false'); }); }
function ddOpen(dd){ ddClose(); const l = dd.querySelector('.dd-list'); l.hidden = false; dd.querySelector('.dd-btn').setAttribute('aria-expanded','true');
  (l.querySelector('[aria-selected="true"]') || l.firstElementChild).focus(); }
function ddPick(dd, v){ const id = dd.dataset.dd; if (id==='pf'){ GS.pf = v; GS.pg = 0; } if (id==='ft') GS.ft = v; if (id==='mf'){ MS.mf = v; MS.pg = 0; } if (id==='mord') MS.order = v; if (id==='xpf') XS.pf = v; if (id==='xsort') XS.txsort = v; if (id==='fwho') FS.who = v; if (id==='nsf') NS.sf = v; if (id==='caf') CS.af = v; if (id==='vcal') VS.cal = v; if (id==='rdf') RS.df = v; if (id==='rlf') RS.lf = v; if (id==='spf') SS.pf = v; if (id==='sof') SS.of = v; if (id==='crf') CS.rf = v; render();
  const b = document.querySelector(`[data-dd="${id}"] .dd-btn`); if (b) b.focus(); }
document.addEventListener('click', e => { if (!e.target.closest('.dd')) ddClose(); }, true);
document.addEventListener('keydown', e => {
  const dd = e.target.closest && e.target.closest('.dd'); if (!dd) return;
  const l = dd.querySelector('.dd-list'), items = [...l.querySelectorAll('[role="option"]')], i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); if (l.hidden) return ddOpen(dd);
    items[(i + (e.key==='ArrowDown'?1:-1) + items.length) % items.length].focus(); }
  else if (e.key === 'Enter' || e.key === ' '){ if (i >= 0){ e.preventDefault(); ddPick(dd, items[i].dataset.ddv); } }
  else if (e.key === 'Escape'){ e.stopPropagation(); ddClose(); dd.querySelector('.dd-btn').focus(); }
  else if (e.key === 'Tab') ddClose();
});

  const fund = [...Array(71).fill('Bank'), ...Array(38).fill('$5'), ...Array(15).fill('Deposit')];
  for (let i=fund.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [fund[i],fund[j]] = [fund[j],fund[i]]; }
  let fi = 0, spent = 0;

/* ── Overview ─────────────────────────────────────────────────────────── */
const UK = { spent:['Spent','var(--fg)','First spend in'], active:['Active','color-mix(in srgb,var(--fg) 45%,transparent)','No spend yet'], opened:['Opened','var(--land)','Not funded'], invited:['Invited','','Not opened'], quiet:['Quiet','','3+ weeks'] };
const uKind = m => m.spend ? 'spent' : m.status==='active' ? 'active' : m.status==='opened' ? 'opened' : m.quiet ? 'quiet' : 'invited';
/* one square per person up to UC_CAP squares; past that each square stands for a round number of people, so the grid keeps its rows as batches grow */
const UC_CAP = 360, UC_STEPS = [1,2,5,10,20,25,50,100,200,250,500,1000];
function unitCell(){
  const order = Object.keys(UK), list = MEMBERS.slice().sort((a,b)=>order.indexOf(uKind(a))-order.indexOf(uKind(b)) || a.id-b.id);
  const n = k => MEMBERS.filter(m=>uKind(m)===k).length, act = mCount(m=>m.status==='active'), opn = n('opened'), total = MEMBERS.length;
  const unit = UC_STEPS.find(u=>Math.ceil(total/u)<=UC_CAP) || 1000, sty = k => UK[k][1]?` style="--c:${UK[k][1]}"`:'';
  const sq = unit===1
    ? list.map(m=>{ const k = uKind(m); return `<button type="button" class="uc-q ${k}" data-member="${m.id}" title="${m.first} ${m.last[0]}. · batch ${m.batch} · ${UK[k][0]}"${sty(k)}></button>`; }).join('')
    : order.map(k=>{ const c = n(k), q = c ? Math.max(1, Math.round(c/unit)) : 0; return `<i class="uc-q ${k}" title="${UK[k][0]} · ${int(c)}"${sty(k)}></i>`.repeat(q); }).join('');
  const grid = `<div class="uc">${sq}</div>`;
  const key = `<div class="uc-k">${order.map(k=>`<div class="uc-kr${k==='opened'?' hl':''}"><i class="uc-q ${k}"${UK[k][1]?` style="--c:${UK[k][1]}"`:''}></i><span><b>${UK[k][0]}</b><span class="small quiet">${UK[k][2]}</span></span><b class="num">${int(n(k))}</b></div>`).join('')}</div>`;
  return gCell('s-8', 'Members', `12 batches · ${unit===1?'a square each':'a square is '+unit}`, figSide(int(act), 'active members', `${pct(act, total)} of ${int(total)} invited`), grid + key,
    `<div class="c-ft split"><button type="button" data-move="nudge"><span class="t">Nudge the ${opn} who opened</span>${ic('chev','sm')}</button><span class="rule" aria-hidden="true"></span>${footItem({t:'Waitlist 1,500 · median wait 24 days'})}</div>`);
}
function mOverview(){
  const act = mCount(m=>m.status==='active'), opn = mCount(m=>m.status==='opened'), inv = mCount(m=>m.status==='invited'), spent = mCount(m=>m.spend), quiet = mCount(m=>m.quiet);
  const W_OPEN = [0,0,0,0,0,0,14,18,32,48,44,32];
  const kpis = kpiCell('Accounts', int(act+opn), `opened, of ${int(MEMBERS.length)} invited`, W_OPEN.map((v,i,a)=>a.slice(0,i+1).reduce((x,y)=>x+y,0)), 'All time')
    + kpiCell('Active', int(act), `${pct(act, MEMBERS.length)} of everyone invited`, [0,0,0,0,0,0,9,25,49,82,117,124], 'All time')
    + kpiCell('First spends', int(spent), `${pct(spent, act)} of active members · 97 were a poster’s $10`, [0,0,0,0,0,0,6,19,40,68,96,109], 'All time')

  /* where everyone is: one row per stage, bars on a shared square-root scale so 1,500 and 64 both read */
  const stages = [['Waitlist',1500,'var(--line)','Waiting for an invite'],['Invited, not opened',inv,'var(--fg-50)',`${quiet} have gone quiet for 3+ weeks`],['Opened, not funded',opn,'var(--land)','No bank, deposit or $5 yet'],['Active, no spend yet',act-spent,'var(--fg-70)','Funded, waiting on a first spend'],['Spent',spent,'var(--fg)','Made a first spend at a partner shop']];
  const smax = Math.sqrt(1500);
  const pipe = gCell('s-7', 'Where everyone is', 'Now', figHtml(int(opn), 'opened an account but haven’t funded it, the easiest win'),
    `<div class="stg">${stages.map(([k,v,c,note],i)=>`<div class="stg-r${i===2?' hl':''}"><span class="stg-k"><b>${k}</b><span class="small quiet">${note}</span></span><b class="num stg-v">${int(v)}</b>
      <span class="stg-bar"><i style="width:${(Math.sqrt(v)/smax*100).toFixed(1)}%;background:${c}"></i></span></div>`).join('')}</div>`,
    `<div class="c-ft split"><button type="button" data-move="nudge"><span class="t">Nudge the ${opn}</span>${ic('chev','sm')}</button><span class="rule" aria-hidden="true"></span>${footItem({t:'Bars use a square-root scale'})}</div>`);

  const how = [['Connected a bank',mCount(m=>m.fund==='Bank')],['Added $5',mCount(m=>m.fund==='$5')],['Direct deposit',mCount(m=>m.fund==='Deposit')]];
  const fund = gCell('s-5', 'How they funded', 'All time', figSide(pct(how[0][1], act), 'connected a bank', 'the most common way in'),
    compBar(how.map(([k,v],i)=>[k,v,SRC_COL[i]])) + `<div class="how two"><span class="k">Median days, invite to active</span><b class="num">6</b><span class="k">From a poster</span><b class="num">${pct(mCount(m=>m.status==='active'&&m.src==='Poster'), act)}</b></div>`);

  const bcell = gCell('s-7', 'Activation by batch', '12 batches of 25', figHtml('48%', 'active in batch 1, the oldest · batch 12 went out yesterday'),
    batchCols() + mkey([['var(--fg)','Active'],['var(--land)','Opened'],['var(--line)','Not opened']]),
    `<div class="c-ft"><button type="button" data-mpane="batches"><span class="t">Batch history</span>${ic('chev','sm')}</button></div>`);

  const shopCount = {}; MEMBERS.filter(m=>m.spend).forEach(m=>shopCount[m.spend] = (shopCount[m.spend]||0)+1);
  const shops = Object.entries(shopCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const spendCell = gCell('s-5', 'Where first spends happen', `${spent} first spends`, figHtml(shops[0][0], `${shops[0][1]} first spends, the most of any shop`),
    `<div class="how">${shops.map(([k,v])=>`<span class="k">${k}</span><b class="num">${v}</b><span class="quiet num">${pct(v,spent)}</span>`).join('')}</div>`,
    `<div class="c-ft"><button type="button" data-go="merchants"><span class="t">Merchants</span>${ic('chev','sm')}</button></div>`);

  const cityC = {}; MEMBERS.forEach(m=>{ const c = cityC[m.city] || (cityC[m.city] = {n:0,a:0}); c.n++; if (m.status==='active') c.a++; });
  const cities = Object.entries(cityC).sort((a,b)=>b[1].n-a[1].n);
  const cityCell = gCell('s-12', 'By city', 'Invited and active', figHtml(cities[0][0], `${cities[0][1].n} invited, the most of any city`),
    `<div class="cityrows">${cities.map(([c,o])=>`<div class="cr"><span class="cr-k">${c}</span><span class="cr-bar"><i style="width:${o.n/cities[0][1].n*100}%"></i><b style="width:${o.a/cities[0][1].n*100}%"></b></span><span class="num cr-v">${o.a}<span class="quiet"> / ${o.n}</span></span><span class="num quiet cr-p">${pct(o.a,o.n)}</span></div>`).join('')}</div>`
    + mkey([['var(--fg)','Active'],['var(--line)','Invited']]));

  return G('Everyone invited', 'Select a square to open them', '', unitCell() + fund.replace('cell s-5','cell s-4 wt')) + G('Batches and spending', '', '', bcell + spendCell) + G('Where members are', '', '', cityCell);
}

/* Member record: a pane, with a timeline of what happened */
function memberPane(){
  if (MS.member == null) return '';
  const m = MEMBERS.find(x=>x.id===MS.member); if (!m) return '';
  const ev = [['Joined the waitlist', m.joined, m.poster ? `From ${m.poster}` : 'From the website'], ['Invited', m.invited, `Batch ${m.batch}`]];
  if (m.opened) ev.push(['Opened an account', m.opened, 'In the Clear app']);
  if (m.activeAt) ev.push([m.fund==='Bank'?'Connected a bank':m.fund==='$5'?'Added $5':'Set up direct deposit', m.activeAt, 'Now active']);
  if (m.spentAt) ev.push(['First spend', m.spentAt, `$10.00 at ${m.spend}`]);
  const next = m.status==='invited' ? ['Not opened yet', m.quiet?'Gone quiet. A resend usually helps.':'Still early in the window.'] : m.status==='opened' ? ['One step left','Connect a bank, set up deposit or add $5.'] : null;
  const action = m.status==='invited' ? ['Resend invite','resend'] : m.status==='opened' ? ['Send a nudge','nudge1'] : null;

      ${m.status!=='active'?`<div><span class="lbl">90-day window</span><div class="wline"><i style="width:${used/90*100}%"></i><span style="left:${used/90*100}%">Today</span></div><div class="axis" style="margin-top:24px"><span>${fmtD(m.invited)}</span><span>${fmtD(m.invited+90*DAY)}</span></div></div>`:''}
      ${next?`<div class="note">${ic('chev','sm')}<span><b>${next[0]}.</b> ${next[1]}</span></div>`:''}
      <div><span class="lbl">What happened</span><ol class="feed mfeed">${ev.map((e,i)=>`<li><div class="mf-row"><span class="node${i===ev.length-1?' on':''}"></span><span class="when">${fmtD(e[1])}</span><span class="what">${e[0]}</span><span class="small quiet">${e[2]}</span></div></li>`).join('')}</ol></div>
      <div class="pv-inline"><button type="button" class="pv${MS.reveal?' on':''}" data-mreveal aria-pressed="${MS.reveal}"><span class="pv-l">${ic(MS.reveal?'eye':'lockc','sm')}<span><b>${MS.reveal?'Details shown':'Details hidden'}</b></span></span><span class="pv-r"><span class="pv-t">${MS.reveal?'Hide':'Show'}</span><span class="tgl" aria-hidden="true"><i></i></span></span></button></div>
    </div>
    <footer class="pane-ft"><button class="btn btn-g" type="button" data-mturnoff="${m.id}">Turn off access</button>${action?`<button class="btn btn-p" type="button" data-mact="${action[1]}" data-mid="${m.id}">${action[0]}</button>`:''}</footer>
  </aside>`;
}
