<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <!-- theme_color is static in the manifest, but browser chrome can follow the theme through
         these. background_color cannot, which is why the splash is ink either way. -->
    <meta name="theme-color" content="#DFE3DE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16211D" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Clear" />
    
    <!-- Mobile web app support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Clear" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Brand guide faces (useclear.org/style). The two above go once nothing uses them. -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=IBM+Plex+Mono:wght@400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Stripe Crypto Onramp Scripts -->
    <script src="https://js.stripe.com/clover/stripe.js"></script>
    <script src="https://crypto-js.stripe.com/crypto-onramp-outer.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
              
              // Check if wallet connection is working after a delay
              setTimeout(() => {
                const appkitButton = document.querySelector('appkit-button');
                if (!appkitButton || !appkitButton.shadowRoot) {
                  console.warn('AppKit button not found, unregistering service worker');
                  registration.unregister();
                }
              }, 3000);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }

      // Ensure AppKit modal icons load properly
      window.addEventListener('load', () => {
        // Preload critical icon resources for AppKit modal
        const iconUrls = [
          // Chain icons
          'https://api.web3modal.com/v2/chain/1/icon',
          'https://api.web3modal.com/v2/chain/8453/icon',
          'https://api.web3modal.com/v2/chain/11155111/icon',
          'https://api.web3modal.com/v2/chain/84532/icon',
          // Wallet icons
          'https://api.web3modal.com/v2/connector/metamask/icon',
          'https://api.web3modal.com/v2/connector/trust/icon',
          'https://api.web3modal.com/v2/connector/coinbase/icon',
          'https://api.web3modal.com/v2/connector/rainbow/icon',
          'https://api.web3modal.com/v2/connector/walletconnect/icon',
          // Social icons
          'https://api.web3modal.com/v2/connector/google/icon',
          'https://api.web3modal.com/v2/connector/apple/icon',
          'https://api.web3modal.com/v2/connector/facebook/icon',
          'https://api.web3modal.com/v2/connector/x/icon',
          'https://api.web3modal.com/v2/connector/github/icon',
          'https://api.web3modal.com/v2/connector/discord/icon',
          'https://api.web3modal.com/v2/connector/farcaster/icon',
          // Action icons
          'https://api.web3modal.com/v2/connector/buy/icon',
          'https://api.web3modal.com/v2/connector/swap/icon',
          'https://api.web3modal.com/v2/connector/send/icon',
          'https://api.web3modal.com/v2/connector/activity/icon',
          'https://api.web3modal.com/v2/connector/disconnect/icon'
        ];

        iconUrls.forEach(url => {
          const link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = url;
          document.head.appendChild(link);
        });

        // Monitor for icon loading issues
        setTimeout(() => {
          const modal = window.appKitModal;
          if (modal) {
            console.log('AppKit modal loaded successfully');
          } else {
            console.warn('AppKit modal not found, icons may not load properly');
          }
        }, 1000);

        // Do not auto-open the modal here. On iOS deep-link flows this can
        // retrigger connect/sign prompts before WalletConnect state restores.
      });
    </script>
  </body>
</html>
